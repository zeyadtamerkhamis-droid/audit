  --ice:#e9f4ff; --pearl:#f6f7fb; --navy:#0b1030; --navy2:#141a44;
  --cyan:#2ccbf2; --violet:#6d5dfc; --pink:#f06fc8; --amber:#ffb547; --turq:#21d3b5; --silver:#c9d1e3;
  --text:#121735; --muted:#4d5677; --soft:#6d7593;
  --bg:#eef2fa;
  --glass-a:rgba(255,255,255,.66); --glass-b:rgba(255,255,255,.30);
  --glass-line:rgba(255,255,255,.85); --gloss:.55;
  --shadow:0 24px 60px -24px rgba(36,40,110,.38),0 2px 8px rgba(36,40,110,.07);
  --card-solid:rgba(255,255,255,.55);
  --ok:#0f9f74; --bad:#d63b5c; --okbg:rgba(33,211,181,.16); --badbg:rgba(240,80,120,.13);
  --rim:conic-gradient(from 210deg,rgba(255,255,255,.95),#7fe9ff 14%,#8b7bff 32%,#ff86d3 50%,#ffc067 66%,rgba(255,255,255,.95) 80%,#7fe9ff);
  --r:26px; --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --arfont:"ZTCairo","Manrope","Segoe UI",Tahoma,sans-serif;
}
:root[data-theme="dark"]{
  --text:#eef1ff; --muted:#b5bddc; --soft:#9aa3c7; --bg:#070a20;
  --glass-a:rgba(38,46,98,.58); --glass-b:rgba(14,18,46,.34); --glass-line:rgba(255,255,255,.22); --gloss:.18;
  --shadow:0 30px 70px -26px rgba(0,0,0,.75),0 2px 8px rgba(0,0,0,.3); --card-solid:rgba(30,36,80,.55);
  --ok:#4ee6bd; --bad:#ff7d9c; --okbg:rgba(33,211,181,.15); --badbg:rgba(255,90,130,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-feature-settings:"liga" 0,"calt" 0;font-family:var(--font);color:var(--text);background:var(--bg);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── background: liquid light field ── */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:
  radial-gradient(1200px 700px at 110% -10%,rgba(139,123,255,.32),transparent 60%),
  radial-gradient(900px 600px at -10% 110%,rgba(44,203,242,.30),transparent 60%),
  linear-gradient(160deg,#f7f9ff 0%,#e8eefb 45%,#efe9fb 100%)}
:root[data-theme="dark"] .bgfx{background:
  radial-gradient(1100px 700px at 110% -10%,rgba(109,93,252,.42),transparent 60%),
  radial-gradient(900px 640px at -10% 110%,rgba(30,170,230,.30),transparent 60%),
  linear-gradient(160deg,#0a0e2c 0%,#070a20 55%,#120a2c 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.b1{width:520px;height:520px;left:-120px;top:8%;background:radial-gradient(circle,#7fe9ff,#2ccbf2 45%,transparent 70%)}
.b2{width:560px;height:560px;right:-160px;top:-120px;background:radial-gradient(circle,#b7a6ff,#6d5dfc 45%,transparent 70%);animation-duration:32s}
.b3{width:420px;height:420px;right:12%;bottom:-140px;background:radial-gradient(circle,#ffb3e4,#f06fc8 45%,transparent 70%);animation-duration:29s}
.b4{width:300px;height:300px;left:38%;top:42%;background:radial-gradient(circle,#ffd89a,#ffb547 50%,transparent 72%);opacity:.32;animation-duration:36s}
:root[data-theme="dark"] .blob{opacity:.42}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}100%{transform:translate(-30px,40px) scale(.95)}}
.grain{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}

/* ── liquid glass material ── */
.glass{position:relative;border-radius:var(--r);background:linear-gradient(140deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--glass-line),inset 0 -1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.12),var(--shadow);isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:var(--rim);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;pointer-events:none;z-index:2}
.glass::after{content:"";position:absolute;left:2px;right:2px;top:2px;height:46%;max-height:140px;border-radius:calc(var(--r) - 2px) calc(var(--r) - 2px) 50% 50%/calc(var(--r) - 2px) calc(var(--r) - 2px) 28px 28px;
  background:linear-gradient(180deg,rgba(255,255,255,var(--gloss)),rgba(255,255,255,0));pointer-events:none;z-index:0}
.glass>*{position:relative;z-index:1}
.glass.clear{background:linear-gradient(140deg,rgba(255,255,255,.38),rgba(255,255,255,.12))}
:root[data-theme="dark"] .glass.clear{background:linear-gradient(140deg,rgba(60,70,140,.32),rgba(20,24,60,.18))}
.pad{padding:28px}
.glow-c{--glow:#2ccbf2}.glow-v{--glow:#6d5dfc}.glow-p{--glow:#f06fc8}.glow-a{--glow:#ffb547}.glow-t{--glow:#21d3b5}.glow-b{--glow:#3b82f6}
.underglow{position:relative}
.underglow>.ug{position:absolute;left:12%;right:12%;bottom:-18px;height:36px;border-radius:50%;background:var(--glow,#6d5dfc);filter:blur(20px);opacity:.55;z-index:-1;transition:opacity .3s,transform .3s}

/* buttons */
.gbtn{--glow:#6d5dfc;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 20px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:.95rem;letter-spacing:.01em;
  color:#fff;background:linear-gradient(180deg,#2a2f5a 0%,#0f1330 55%,#070a1d 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(0,0,0,.4),0 10px 24px -10px var(--glow),0 2px 4px rgba(0,0,0,.18);transition:transform .18s,box-shadow .25s,filter .2s;isolation:isolate}
.gbtn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.3px;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8;pointer-events:none}
.gbtn::after{content:"";position:absolute;left:10%;right:10%;top:2px;height:45%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
.gbtn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 6px rgba(0,0,0,.4),0 16px 34px -10px var(--glow),0 2px 4px rgba(0,0,0,.18)}
.gbtn:active{transform:translateY(0) scale(.98)}
.gbtn.light{color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(236,242,255,.6));box-shadow:inset 0 1px 0 #fff,inset 0 -2px 6px rgba(80,90,160,.12),0 10px 22px -12px var(--glow),0 1px 3px rgba(30,40,90,.12)}
:root[data-theme="dark"] .gbtn.light{color:#eef1ff;background:linear-gradient(180deg,rgba(80,92,170,.55),rgba(30,36,80,.55));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px -12px var(--glow)}
.gbtn.sm{min-height:36px;padding:6px 14px;font-size:.85rem}
.gbtn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.gbtn.on{background:linear-gradient(180deg,#5b8cff,#6d5dfc 55%,#4a2fd6);color:#fff}
.gbtn.ok{background:linear-gradient(180deg,#43e0bd,#12a985 60%,#0b7d63);--glow:#21d3b5;color:#fff}
.gbtn.warn{background:linear-gradient(180deg,#ffd38a,#f2a531 60%,#c97c0c);--glow:#ffb547;color:#20160a}
.gbtn.bad{background:linear-gradient(180deg,#ff9fbd,#e8487a 60%,#b51f52);--glow:#f06fc8;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 2px 6px rgba(40,50,120,.08);color:var(--muted)}
:root[data-theme="dark"] .chip{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.chip.L{color:#0d6e8c}.chip.A{color:#9b2c8a}.chip.M{color:#7a5300}
:root[data-theme="dark"] .chip.L{color:#7fe9ff}:root[data-theme="dark"] .chip.A{color:#ff9ad9}:root[data-theme="dark"] .chip.M{color:#ffd28a}
.seg{display:inline-flex;padding:4px;border-radius:999px;gap:2px;background:rgba(255,255,255,.35);box-shadow:inset 0 1px 3px rgba(20,30,80,.15),inset 0 0 0 1px rgba(255,255,255,.6)}
:root[data-theme="dark"] .seg{background:rgba(0,0,0,.25);box-shadow:inset 0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--muted);min-height:32px}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#fff,#e9efff);color:#1b1f45;box-shadow:0 4px 12px -4px rgba(109,93,252,.5),inset 0 1px 0 #fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:linear-gradient(180deg,#5c6fe0,#4a3fc4);color:#fff}

/* ── top bar ── */
.top{position:sticky;top:12px;z-index:50;margin:12px auto 0;max-width:1320px;width:calc(100% - 24px);display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;border-radius:999px;--r:999px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;border:0;background:none;padding:0}
.brand b{font-weight:800;letter-spacing:.06em;font-size:.86rem;white-space:nowrap}
.brand small{display:block;font-size:.68rem;color:var(--soft);letter-spacing:.08em;font-weight:700}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.nav::-webkit-scrollbar{display:none}
.nav button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:8px 13px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.nav button:hover{background:rgba(255,255,255,.45);color:var(--text)}
:root[data-theme="dark"] .nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{color:#fff;background:linear-gradient(180deg,#2a2f5a,#0f1330);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 18px -8px #6d5dfc}
.tools{display:flex;gap:6px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(230,236,255,.55));box-shadow:inset 0 1px 0 #fff,0 4px 10px -4px rgba(40,50,120,.3);color:var(--text)}
:root[data-theme="dark"] .iconbtn{background:linear-gradient(180deg,rgba(90,100,180,.5),rgba(30,36,80,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

/* ── layout ── */
main{max-width:1320px;margin:0 auto;padding:26px 16px 80px}
.view{display:none;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.view.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4vw,3.1rem);font-weight:800}
h2{font-size:clamp(1.35rem,2.4vw,1.9rem);font-weight:800}
h3{font-size:1.15rem;font-weight:800}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--violet)}
:root[data-theme="dark"] .eyebrow{color:#a99dff}
.muted{color:var(--muted)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.mt{margin-top:20px}.mt2{margin-top:32px}
.secthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 18px}

/* ── dashboard ── */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:stretch}
.hero-main{padding:38px;display:flex;flex-direction:column;justify-content:space-between;min-height:340px;overflow:hidden}
.hero-main .logo-wrap{position:absolute;right:-30px;top:-30px;opacity:.95;transform:rotate(-8deg)}
.hero-main .logo-wrap .zt-logo{filter:drop-shadow(0 30px 40px rgba(109,93,252,.45))}
.hero h1 .grad{background:linear-gradient(90deg,#16b8e6,#6d5dfc 45%,#e45bc4 80%,#f0a03a);-webkit-background-clip:text;background-clip:text;color:transparent}
.idcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px}
.idcard .pill{padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6)}
:root[data-theme="dark"] .idcard .pill{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.idcard small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.12em;color:var(--soft)}
.idcard b{font-size:1rem;letter-spacing:.03em}
.progress-panel{padding:26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ring{display:flex;gap:12px;align-items:center}
.ring svg{flex:none}
.ring b{font-size:1.25rem;display:block;line-height:1.1}
.ring small{color:var(--soft);font-weight:700;font-size:.76rem}
.ring circle.fg{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.navcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:26px}
.ncard{display:flex;align-items:center;gap:16px;padding:22px 22px 24px;border:0;text-align:left;cursor:pointer;--r:30px;color:var(--text);transition:transform .25s}
.ncard:hover{transform:translateY(-4px)}
.ncard:hover .ug{opacity:.85;transform:scaleX(1.08)}
.ncard .nicon{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--glow) 70%,#fff),var(--glow));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.15),0 10px 22px -8px var(--glow)}
.ncard b{display:block;font-size:1.02rem;letter-spacing:.04em}
.ncard small{color:var(--muted);font-size:.84rem}
.ncard .arrow{margin-left:auto;opacity:.6}

/* ── learn ── */
.learn{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:92px;padding:14px;max-height:calc(100vh - 110px);overflow:auto}
.side button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:16px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.9rem}
.side button .num{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-size:.8rem;flex:none;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
:root[data-theme="dark"] .side button .num{background:rgba(255,255,255,.08);box-shadow:none}
.side button[aria-current="true"]{background:rgba(255,255,255,.6);color:var(--text);box-shadow:inset 0 1px 0 #fff,0 6px 14px -8px rgba(109,93,252,.5)}
:root[data-theme="dark"] .side button[aria-current="true"]{background:rgba(255,255,255,.1)}
.side button[aria-current="true"] .num{background:linear-gradient(160deg,#7fe9ff,#6d5dfc);color:#fff}
.side .done{margin-left:auto;color:var(--ok)}
.modhead{padding:28px 30px;margin-bottom:20px}
.topic{padding:28px 30px;margin-bottom:22px}
.topic .thead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.blk{margin-top:18px}
.blk>.lbl{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.blk>.lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#7fe9ff,#6d5dfc);box-shadow:0 0 10px #7fe9ff}
.quote{padding:16px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(127,233,255,.18),rgba(139,123,255,.14));border-left:3px solid #6d5dfc;font-style:italic;color:var(--text)}
.ar,[dir="rtl"]{font-family:var(--arfont);direction:rtl;text-align:right;line-height:1.95;unicode-bidi:isolate}
.ar{padding:16px 20px;border-radius:18px;background:linear-gradient(225deg,rgba(240,111,200,.10),rgba(255,181,71,.08));border-right:3px solid var(--pink)}
.en-box{padding:2px 0}
:root[data-lang="en"] .pair>.ar,:root[data-lang="en"] .ar-only{display:none}
:root[data-lang="ar"] .pair>.en{display:none}
.example{padding:16px 20px;border-radius:18px;background:rgba(33,211,181,.10);border-left:3px solid var(--turq)}
.points{display:flex;flex-wrap:wrap;gap:8px}
.points span{padding:7px 13px;border-radius:12px;font-size:.88rem;font-weight:600;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 2px 8px -4px rgba(40,50,120,.25)}
:root[data-theme="dark"] .points span{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
details.acc{border-radius:18px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);margin-top:10px;overflow:hidden}
:root[data-theme="dark"] details.acc{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;gap:10px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";margin-left:auto;font-size:1.3rem;line-height:1;transition:transform .25s;color:var(--violet)}
details.acc[open]>summary::after{transform:rotate(45deg)}
details.acc>.body{padding:0 18px 16px;animation:rise .3s}
.qa-q{font-weight:700}
.model{margin-top:8px;padding:14px 16px;border-radius:14px;background:rgba(109,93,252,.08);border-left:3px solid var(--violet)}

/* process diagram */
.process{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative;margin:10px 0}
.pstep{border:0;cursor:pointer;padding:18px;text-align:left;--r:22px;color:var(--text);transition:transform .25s}
.pstep .pn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;margin-bottom:10px;background:linear-gradient(160deg,color-mix(in srgb,var(--glow) 60%,#fff),var(--glow));box-shadow:0 8px 18px -6px var(--glow)}
.pstep b{display:block;font-size:.95rem}
.pstep[aria-pressed="true"]{transform:translateY(-6px)}
.pstep[aria-pressed="true"]::before{opacity:1;padding:2.2px}
.pdetail{padding:22px 24px;margin-top:16px}

/* letter explorer */
.explorer{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.paper{padding:40px 44px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:1.75;--r:22px}
.paper .lh{text-align:center;margin-bottom:6px}
.paper .lh b{font-family:var(--font);letter-spacing:.14em;font-size:1.05rem}
.paper .date{text-align:right;margin:10px 0 16px}
.seg-btn{display:inline;border:0;background:transparent;padding:1px 2px;border-radius:6px;cursor:pointer;text-align:inherit;font:inherit;line-height:inherit;color:inherit;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background .2s,box-shadow .2s}
.seg-btn:hover{background:rgba(127,233,255,.25)}
.seg-btn.sel{background:linear-gradient(90deg,rgba(127,233,255,.45),rgba(167,139,250,.38),rgba(255,134,211,.32));box-shadow:0 0 0 1px rgba(109,93,252,.35),0 4px 14px -6px rgba(109,93,252,.6)}
.seg-btn.rel{background:rgba(139,123,255,.12)}
.lp{margin:0 0 14px;text-indent:1.6em}
.lp.list{text-indent:0}
.detail{position:sticky;top:92px;padding:26px;max-height:calc(100vh - 110px);overflow:auto}
.clausebar{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.clausebar button{width:38px;height:38px;border-radius:12px;border:0;cursor:pointer;font-weight:800;font-size:.85rem;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);color:var(--muted)}
:root[data-theme="dark"] .clausebar button{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.clausebar button.on{background:linear-gradient(160deg,#7fe9ff,#6d5dfc);color:#fff}
.clausebar button.seen{color:var(--ok)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fact{padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.6)}
:root[data-theme="dark"] .fact{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.fact small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.fact b{font-size:.92rem}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.93rem}
.kv dt{font-weight:800;color:var(--soft);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0}

/* responsibility board */
.respboard{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.respcol{padding:22px}
.respitem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;cursor:pointer;padding:12px 14px;border-radius:16px;margin-top:8px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.75);color:var(--text)}
:root[data-theme="dark"] .respitem{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.respitem small{display:none;color:var(--muted)}
.respitem[aria-expanded="true"] small{display:block}
.respitem .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:var(--glow);box-shadow:0 0 12px var(--glow)}
.sort{padding:22px}
.sort .stmt{font-weight:700;font-size:1.05rem;margin:8px 0 14px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:18px}
table.gt{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;min-width:560px}
table.gt th{text-align:left;padding:14px 16px;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#2a2f5a,#0f1330)}
table.gt th:first-child{border-top-left-radius:16px}table.gt th:last-child{border-top-right-radius:16px}
table.gt td{padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(120,130,190,.18);background:rgba(255,255,255,.35)}
:root[data-theme="dark"] table.gt td{background:rgba(255,255,255,.03)}
table.gt td:first-child{font-weight:800;color:var(--muted);width:22%}
table.gt tr:hover td{background:rgba(127,233,255,.14)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

/* flashcards */
.flashwrap{max-width:820px;margin:0 auto}
.flash{perspective:1600px;height:430px;margin:12px 0 26px;cursor:pointer}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:34px;display:flex;flex-direction:column;--r:34px;overflow:auto}
.face.front{justify-content:center;align-items:center;text-align:center;background:linear-gradient(150deg,#1b2050 0%,#0b0f2a 60%,#1c0f3c 100%);color:#fff}
.face.front::after{--gloss:.22}
.face.front .ftxt{font-size:clamp(1.3rem,3vw,2rem);font-weight:800;max-width:600px}
.face.front .fglow{position:absolute;left:15%;right:15%;bottom:-10px;height:60px;border-radius:50%;background:linear-gradient(90deg,#2ccbf2,#6d5dfc,#f06fc8,#ffb547);filter:blur(28px);opacity:.7;z-index:-1}
.face.back{transform:rotateY(180deg)}
.face .tag{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:#9fb0ff;text-transform:uppercase;margin-bottom:12px}
.keyphrase{margin-top:auto;padding:12px 16px;border-radius:14px;font-weight:800;background:linear-gradient(90deg,rgba(127,233,255,.3),rgba(167,139,250,.25),rgba(255,134,211,.22))}
.fprog{height:8px;border-radius:999px;background:rgba(120,130,190,.2);overflow:hidden}
.fprog i{display:block;height:100%;background:linear-gradient(90deg,#2ccbf2,#6d5dfc,#f06fc8);border-radius:999px;transition:width .5s}

/* quiz */
.quizgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.qcard{padding:30px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;cursor:pointer;padding:14px 16px;border-radius:18px;margin-top:10px;font-size:.98rem;color:var(--text);background:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7),0 4px 12px -8px rgba(40,50,120,.35);transition:transform .15s,background .2s,box-shadow .2s}
:root[data-theme="dark"] .opt{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.opt:hover:not([disabled]){transform:translateX(4px)}
.opt .let{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none;background:rgba(109,93,252,.12);color:var(--violet)}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--violet),0 8px 20px -10px var(--violet)}
.opt[aria-pressed="true"] .let{background:var(--violet);color:#fff}
.opt.right{background:var(--okbg);box-shadow:inset 0 0 0 2px var(--ok)}
.opt.right .let{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);box-shadow:inset 0 0 0 2px var(--bad)}
.opt.wrong .let{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;padding:16px 18px;border-radius:18px;animation:rise .35s}
.feedback.good{background:var(--okbg);border-left:3px solid var(--ok)}
.feedback.badf{background:var(--badbg);border-left:3px solid var(--bad)}
.score{padding:24px;position:sticky;top:92px}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(120,130,190,.18);font-weight:700}
.stat span{color:var(--soft);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.dots button{width:26px;height:26px;border-radius:8px;border:0;font-size:.7rem;font-weight:800;cursor:pointer;background:rgba(120,130,190,.18);color:var(--muted)}
.dots button.r{background:var(--ok);color:#fff}.dots button.w{background:var(--bad);color:#fff}.dots button.cur{box-shadow:0 0 0 2px var(--violet)}
textarea.ans{width:100%;min-height:110px;border-radius:16px;border:0;padding:14px 16px;resize:vertical;background:rgba(255,255,255,.6);box-shadow:inset 0 2px 6px rgba(20,30,80,.1),inset 0 0 0 1px rgba(255,255,255,.8)}
:root[data-theme="dark"] textarea.ans{background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.summary{padding:30px;text-align:center}
.bigscore{font-size:4rem;font-weight:800;line-height:1;background:linear-gradient(90deg,#16b8e6,#6d5dfc,#e45bc4);-webkit-background-clip:text;background-clip:text;color:transparent}

/* oral */
.prof{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.oq{padding:34px;min-height:260px}
.oq .lvl{position:absolute;top:24px;right:26px}
.oq h2{font-size:clamp(1.3rem,2.6vw,1.8rem);margin-top:12px;max-width:90%}
.avatar{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#7fe9ff,#6d5dfc 60%,#f06fc8);box-shadow:0 12px 24px -10px #6d5dfc}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.4rem;min-width:70px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{padding:5px 11px;border-radius:999px;font-size:.82rem;font-weight:800;background:linear-gradient(90deg,rgba(127,233,255,.35),rgba(167,139,250,.3));}
.mistake{color:var(--bad);font-weight:600}
.rlist button{display:block;width:100%;text-align:left;border:0;background:rgba(255,255,255,.4);padding:10px 12px;border-radius:12px;margin-top:6px;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--text)}
:root[data-theme="dark"] .rlist button{background:rgba(255,255,255,.05)}

/* revision */
.must .tier{padding:22px;margin-bottom:16px}
.must .tier li{margin:6px 0}
.cheat{padding:28px}
.cheat dl{display:grid;grid-template-columns:160px 1fr;gap:10px 18px;margin:0}
.cheat dt{font-weight:800;color:var(--violet)}
.cheat dd{margin:0}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:#6d5dfc;margin-top:3px;flex:none}
.rapid{padding:50px 34px;text-align:center;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rapid .line{font-size:clamp(1.4rem,3.4vw,2.4rem);font-weight:800;max-width:780px;animation:rise .4s}
.script p{margin:0 0 14px}
.sec-blk{padding:18px 20px;border-radius:18px;margin-top:12px;background:rgba(255,255,255,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.65)}
:root[data-theme="dark"] .sec-blk{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}

footer.foot{max-width:1320px;margin:0 auto 30px;padding:18px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;--r:24px;width:calc(100% - 32px)}
footer.foot small{color:var(--soft)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);padding:12px 20px;border-radius:999px;z-index:99;color:#fff;background:linear-gradient(180deg,#2a2f5a,#0f1330);box-shadow:0 12px 30px -10px #6d5dfc;transition:transform .35s;font-weight:700}
.toast.show{transform:translateX(-50%) translateY(0)}

/* responsive */
@media (max-width:1060px){
  .hero{grid-template-columns:1fr}
  .learn,.explorer,.quizgrid,.prof{grid-template-columns:1fr}
  .side,.detail,.score{position:static;max-height:none}
  .navcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .process{grid-template-columns:repeat(2,1fr)}
  .brand .btxt{display:none}
}
@media (max-width:680px){
  main{padding:18px 12px 60px}
  .top{flex-wrap:wrap;border-radius:28px;--r:28px}
  .nav{order:3;flex-basis:100%;justify-content:flex-start}
  .navcards,.g2,.g3,.g4,.respboard,.progress-panel{grid-template-columns:1fr}
  .pad,.topic,.qcard,.modhead,.paper,.oq{padding:22px}
  .paper{padding:24px 20px}
  .flash{height:520px}
  .cheat dl,.kv{grid-template-columns:1fr}
  .hero-main .logo-wrap{opacity:.35}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
:root.reduce *, :root.reduce *::before, :root.reduce *::after{animation:none!important;transition:none!important}
/* print */
@media print{
  .bgfx,.top,.tools,footer.foot,.toast,.no-print{display:none!important}
  body{background:#fff;color:#111}
  .glass{background:#fff!important;box-shadow:none!important;border:1px solid #ccd;backdrop-filter:none!important;break-inside:avoid}
  .glass::before,.glass::after{display:none}
  .side,.detail,.score{position:static}
  .learn,.explorer,.quizgrid,.prof{grid-template-columns:1fr}
  details.acc>.body{display:block!important}
  .flash{height:auto}.flash-inner{transform:none!important}.face{position:static;backface-visibility:visible;transform:none!important;color:#111!important;background:#fff!important}
}
</style>

ZT.modules = [
/* ───────────────────────── MODULE 1 ───────────────────────── */
{ id:"m1", no:1, t:"External Auditing", tAr:"المراجعة الخارجية",
  intro:"The foundation: what an external audit is, what it examines, against which criteria, and what it produces.",
  introAr:"الأساس كله: يعني إيه مراجعة خارجية، بتراجع إيه، بتقارن بإيه، وفي الآخر بتطلّع إيه.",
  topics:[
  { id:"t1", t:"Definition of External Auditing", tAr:"تعريف المراجعة الخارجية", src:"L",
    concept:"It is a systematic process of objectively obtaining and evaluating evidence regarding management assertions about the financial statements, to ascertain the degree of correspondence between those assertions and established criteria (applicable financial reporting framework), and communicate an objective opinion to final users through the audit report.",
    en:"The definition has five building blocks. (1) Systematic process — the audit follows planned phases and professional standards (GAAS), not random checks. (2) Objectively obtaining and evaluating evidence — the auditor is independent and bases conclusions on evidence, not on trust. (3) Management assertions — the financial statements are management's claims; the auditor tests those claims. (4) Degree of correspondence with established criteria — the claims are compared with the applicable financial reporting framework. (5) Objective opinion communicated through the audit report — the final product is an opinion, delivered in writing to users. The lecture adds the purpose: to enhance the credibility of the client's financial statements and to state whether they are presented fairly, in all material respects, in accordance with the applicable framework.",
    ar:"خلّي التعريف ده في دماغك كخمس حتت: أولاً هي «عملية منظمة» (systematic process) يعني ليها مراحل ومعايير (GAAS) مش شغل عشوائي. ثانياً المراجع «بيجمع ويقيّم أدلة بموضوعية» (evidence) — مش بيصدّق الإدارة على كلامها. ثالثاً اللي بيتراجع هو «تأكيدات الإدارة» (management assertions) — القوائم المالية دي في الحقيقة ادّعاءات الإدارة. رابعاً بنقيس «درجة التطابق» بين التأكيدات دي والمعايير المعتمدة (applicable financial reporting framework). وخامساً النتيجة النهائية «رأي محايد» (objective opinion) بيوصل للمستخدمين في «تقرير مكتوب» (audit report). الهدف من ده كله إنه يزوّد مصداقية القوائم المالية عند المستثمرين والبنوك وغيرهم.",
    ex:"A bank is considering a loan to a clothing company. The company's statements show profit of EGP 12 million. The bank does not rely on management's word; it relies on the external auditor's opinion that the statements are presented fairly in accordance with EAS.",
    points:["Systematic = planned phases + professional standards (GAAS)","Evidence is obtained and evaluated objectively","Subject matter = management assertions in the financial statements","Criteria = applicable financial reporting framework","Product = objective opinion in a written audit report","Purpose = enhance credibility for final users"],
    q:"Define external auditing and explain why it is called a systematic process.",
    a:"External auditing is a systematic process of objectively obtaining and evaluating evidence about management's assertions in the financial statements, to determine how well they correspond with the applicable financial reporting framework, and to communicate an objective opinion to users in a written audit report. It is systematic because it follows defined phases — acceptance, planning, fieldwork and reporting — and is performed according to professional standards (GAAS).",
    why:"The answer reproduces every element of the lecture definition and uses the lecture's own justification for 'systematic': four phases plus professional standards (GAAS)."},
  { id:"t2", t:"Management Assertions", tAr:"تأكيدات الإدارة", src:"L",
    concept:"Management assertions at the financial statement level: existence and occurrence, completeness, valuation and allocation, rights and obligations, and presentation and disclosure.",
    en:"When management issues financial statements, it implicitly claims several things about every figure. Existence and occurrence: recorded assets and liabilities exist and recorded transactions actually happened. Completeness: everything that should be recorded has been recorded — nothing is omitted. Valuation and allocation: items are measured at appropriate amounts and allocated to the correct periods. Rights and obligations: the entity owns or controls its assets and its liabilities are genuine obligations of the entity. Presentation and disclosure: items are correctly classified, described and disclosed in the notes. The audit is designed around these assertions — each audit procedure tests one or more of them.",
    ar:"لما الإدارة تطلّع قوائم مالية، هي ضمنياً بتقول كام حاجة عن كل رقم. Existence & Occurrence: الأصول موجودة فعلاً والعمليات حصلت فعلاً. Completeness: مفيش حاجة اتنست — كل اللي المفروض يتسجل اتسجل. Valuation & Allocation: الأرقام متقيّمة صح ومتوزعة على الفترة الصح. Rights & Obligations: الشركة فعلاً مالكة الأصول والالتزامات دي فعلاً عليها. Presentation & Disclosure: البنود متبوّبة ومعروضة صح ومفصّح عنها في الإيضاحات. ليه ده مهم؟ لأن كل إجراء مراجعة بيعمله المراجع هدفه يختبر تأكيد أو أكتر من دول.",

    points:["Five assertions in the lecture","Existence/Occurrence → is it real?","Completeness → is anything missing?","Valuation/Allocation → is the amount right?","Rights/Obligations → does it belong to the entity?","Presentation/Disclosure → is it shown and explained correctly?"],
    q:"What are the types of management assertions at the financial statement level?",
    a:"Existence and occurrence, completeness, valuation and allocation, rights and obligations, and presentation and disclosure.",
    why:"This is the exact list given in the lecture's answer key (Case Study, Question 4)."},
  { id:"t3", t:"Audit Evidence", tAr:"أدلة المراجعة", src:"L",
    concept:"An audit involves performing procedures to obtain audit evidence about the amounts and disclosures in the financial statements. The major reason an independent auditor gathers audit evidence is to form an opinion on the financial statements.",
    en:"Audit evidence is the information the auditor uses to reach conclusions — documents, confirmations, observations, recalculations and management's explanations. The auditor's opinion is only as strong as the evidence behind it. The lecture's MCQ makes the point directly: the major reason for gathering evidence is to form an opinion on the financial statements — not primarily to detect fraud or to evaluate management. In most cases evidence comes from testing a sample, which is one reason assurance is reasonable rather than absolute.",
    ar:"الـ audit evidence هي أي معلومة المراجع بيعتمد عليها عشان يوصل لنتيجة: مستندات، مصادقات، ملاحظة جرد، إعادة حساب، وردود الإدارة. الرأي قوته من قوة الدليل اللي وراه. وخلي بالك من سؤال الدكتورة في الـ MCQ: السبب الأساسي لجمع الأدلة هو «تكوين رأي في القوائم المالية» — مش اكتشاف الغش ومش تقييم الإدارة. وغالباً الدليل بييجي من عيّنة (sample)، وده من أسباب إن التأكيد «معقول» مش «مطلق».",
    ex:"To test accounts receivable of EGP 6 million, the auditor sends confirmation letters to a sample of customers and compares replies with the ledger.",
    points:["Evidence supports the opinion","Obtained through audit procedures","Usually based on samples","Selection of procedures depends on auditor's judgment"],
    q:"What is the major reason an independent auditor gathers audit evidence?",
    a:"To form an opinion on the financial statements.",
    why:"This is the answer marked in the lecture (MCQ 6). Detecting fraud, evaluating management and assessing control risk are activities inside the audit, but the purpose of evidence is to support the opinion."},
  { id:"t4", t:"Financial Reporting Framework (Established Criteria)", tAr:"إطار إعداد التقارير المالية (المعايير المعتمدة)", src:"L",
    concept:"Established criteria of comparison (applicable financial reporting framework) in Egypt: a measurement of credibility for management assertions, including (1) Egyptian Accounting Standards (EAS), (2) IFRS, (3) GAAP, (4) related laws and regulations (as tax law).",
    en:"An auditor cannot say statements are 'fair' without a yardstick. That yardstick is the applicable financial reporting framework — the criteria against which management's assertions are measured. In Egypt the lecture lists EAS, IFRS, generally accepted accounting principles and related laws and regulations such as tax law. Important distinction: the framework (EAS/IFRS/GAAP) tells management how to PREPARE the statements; auditing standards (GAAS) tell the auditor how to AUDIT them. GAAS is never the criterion for evaluating the statements.",
    ar:"المراجع مينفعش يقول القوائم «عادلة» من غير مسطرة يقيس بيها. المسطرة دي هي الـ applicable financial reporting framework. في مصر المحاضرة بتقول إنها: معايير المحاسبة المصرية (EAS)، والـ IFRS، والـ GAAP، والقوانين المرتبطة زي قانون الضرائب. وأهم نقطة امتحانات: الـ framework ده بيقول للإدارة «تعِدّ» القوائم إزاي، إنما الـ GAAS بتقول للمراجع «يراجع» إزاي. يعني GAAS عمرها ما تكون المعيار اللي بنقيس عليه القوائم.",
    ex:"An Egyptian company records revenue according to EAS 48. The auditor compares the company's revenue recognition with EAS 48 (criteria) while performing the work according to auditing standards (GAAS).",
    points:["Criteria = yardstick for management assertions","Egypt: EAS, IFRS, GAAP, related laws (e.g. tax law)","Framework → preparation; GAAS → audit performance","In the Babb case the framework is US GAAP"],
    q:"What are the measurement criteria of the external audit service?",
    a:"The applicable financial reporting framework — in Egypt: Egyptian Accounting Standards, IFRS, generally accepted accounting principles and related laws and regulations such as tax law.",
    why:"Matches the lecture's answer key (Q9) and the list on page 3. Choosing GAAS here would be wrong, as the lecture's MCQ 4 shows."},
  { id:"t5", t:"Auditor's Responsibility & Reasonable Assurance", tAr:"مسؤولية المراجع والتأكيد المعقول", src:"L",
    concept:"The overall responsibility of the auditor in conducting an audit is to obtain reasonable assurance about whether the financial statements as a whole (not on each statement) are free from material misstatement, whether due to fraud or error, thereby enabling the auditor to express an opinion on whether the financial statements are presented fairly, in all material respects, in accordance with an applicable financial reporting framework.",
    en:"Three phrases carry this definition. 'Reasonable assurance' — a high level of assurance, but not a guarantee. 'Financial statements as a whole' — the opinion covers the complete set, not a separate opinion on each statement or each account. 'Free from material misstatement, whether due to fraud or error' — the auditor focuses on misstatements large enough to influence users, whatever their cause. The responsibility ends in an opinion on fair presentation 'in all material respects', which is why small immaterial errors do not change the opinion.",
    ar:"ركّز على تلات عبارات: «reasonable assurance» يعني درجة تأكيد عالية بس مش ضمان. «as a whole» يعني الرأي على القوائم ككل — مش رأي منفصل على كل قائمة أو كل حساب (ودي الدكتورة كاتباها بالأحمر). «free from material misstatement, whether due to fraud or error» يعني المراجع مهتم بالأخطاء المؤثرة (material) سواء كانت غش متعمّد أو خطأ غير مقصود. وفي الآخر بيدّي رأي إن القوائم معروضة بعدالة «in all material respects» — وعشان كده غلطة صغيرة مش مؤثرة مش هتغيّر الرأي.",
    ex:"A company misclassifies EGP 3,000 of stationery in a company with revenue of EGP 200 million. The error is immaterial; the opinion on the statements as a whole is unaffected.",
    points:["Reasonable — not absolute — assurance","Opinion on the statements as a whole","Focus on MATERIAL misstatement","Fraud or error both covered","Opinion = fair presentation in all material respects"],
    q:"Does the auditor give an opinion on each financial statement separately?",
    a:"No. The auditor obtains reasonable assurance and expresses an opinion on the financial statements as a whole, not a separate opinion on each statement or account.",
    why:"The lecture highlights 'as a whole (not on each statement)' and True/False item 2 tests exactly this point (answer: False)."},
  { id:"t6", t:"Objective Opinion & Written Audit Report", tAr:"الرأي المحايد وتقرير المراجعة المكتوب", src:"L",
    concept:"The final product of the external audit is the auditor's opinion; the method of delivering it is the written audit report; it is relied on by stakeholders (investors, shareholders, regulators).",
    en:"The audit does not end with working papers — it ends with an opinion. The opinion is 'objective' because the auditor is independent of the entity and relies on evidence. It is communicated in a written audit report so that it is formal, permanent and can be relied on by stakeholders such as investors, shareholders and regulators. In the Babb Clothing letter the auditor promises a written report addressed to the board of directors.",
    ar:"المراجعة مبتخلصش بأوراق العمل — بتخلص بـ «رأي». والرأي ده «محايد» (objective) لأن المراجع مستقل ومعتمد على أدلة. وبيتسلّم في «تقرير مكتوب» (written audit report) عشان يبقى رسمي وثابت ويقدر المستثمرين والمساهمين والجهات الرقابية يعتمدوا عليه. وفي خطاب Babb المراجع بيقول إن التقرير هيكون موجه لمجلس الإدارة (board of directors).",
    ex:"Shareholders of a listed company read the audit report in the annual report before voting at the general assembly.",
    points:["Final product = auditor's opinion","Delivery method = written audit report","Users = investors, shareholders, regulators","Objectivity comes from independence + evidence"],
    q:"What is the final product of the external audit and how is it delivered?",
    a:"The final product is the auditor's opinion, delivered through a written audit report to stakeholders such as investors, shareholders and regulators.",
    why:"Taken from the lecture's answer key (Q6, Q7, Q8)."},
  { id:"t7", t:"Field of the External Audit & the Auditor's Role", tAr:"مجال المراجعة الخارجية ودور المراجع", src:"L",
    concept:"Field of external audit service: the management assertions related to the entity's financial statements — income statement, owners' equity statement, balance sheet (statement of financial position), cash flow statement, statement of comprehensive income, and related disclosure footnotes. Type of service: attestation and assurance service. Provider: the external auditor (Certified Public Accountant).",
    en:"The audit field is not 'the company' in general — it is the set of financial statements and their notes, i.e. the management assertions they contain. The external auditor (a CPA in the US; a registered auditor in Egypt) provides an attestation and assurance service: an independent professional service that increases the reliability of information used by decision makers. Why do users need it? Because management prepares the statements and users rely on them, and their interests may differ — the lecture's MCQ 5 identifies this as the reason independent auditors report on financial statements.",
    ar:"مجال المراجعة مش «الشركة» كلها — هو القوائم المالية والإيضاحات بتاعتها: قائمة الدخل، قائمة التغير في حقوق الملكية، الميزانية (statement of financial position)، قائمة التدفقات النقدية، قائمة الدخل الشامل، والإيضاحات. نوع الخدمة: attestation and assurance service. اللي بيقدّمها: المراجع الخارجي (CPA). وليه أصلاً محتاجينه؟ لأن الإدارة هي اللي بتعدّ القوائم والمستخدمين هما اللي بيعتمدوا عليها، ومصالحهم ممكن تختلف — ودي إجابة MCQ 5 في المحاضرة (different interests).",
    ex:"Management benefits from reporting higher profit (bonuses); investors need neutral figures. The independent auditor bridges this conflict of interest.",
    points:["Field = financial statements + notes (management assertions)","Service = attestation and assurance","Provider = external auditor (CPA)","Need arises from different interests of preparers and users"],
    q:"Why does an independent auditor report on financial statements?",
    a:"Because different interests may exist between the company preparing the statements and the persons using them, so users need an independent opinion on their reliability.",
    why:"This is option (b) of the lecture's MCQ 5, the classic 'conflict of interest' reason for auditing."}
  ]},

{ id:"m2", no:2, t:"External Audit Process", tAr:"مراحل عملية المراجعة الخارجية",
  intro:"The four phases of the external audit service and why the Engagement Letter sits at the end of Phase 1.",
  introAr:"المراحل الأربعة للمراجعة، وليه خطاب الارتباط بييجي في آخر المرحلة الأولى.",
  phases:[
    {n:1,t:"Acceptance of Audit Client Engagement",tAr:"قبول التكليف",en:"Decide whether to accept the client: evaluate the client, identify reasons for the audit, assign appropriate staff and agree fees. The outcome is documented in the Engagement Letter.",ar:"بتقرر تقبل العميل ولا لأ: تقييم العميل، معرفة سبب المراجعة، اختيار الفريق، والاتفاق على الأتعاب. والنتيجة بتتوثق في خطاب الارتباط.",out:"Engagement Letter"},
    {n:2,t:"Planning the Audit Approach",tAr:"تخطيط المراجعة",en:"Understand the entity and its internal control, assess risks of material misstatement and design the nature, timing and extent of procedures.",ar:"فهم الشركة ونظام الرقابة الداخلية، تقييم مخاطر التحريف الجوهري، وتصميم طبيعة وتوقيت ومدى الإجراءات.",out:"Audit plan / programme"},
    {n:3,t:"Field Work Implementing",tAr:"تنفيذ العمل الميداني",en:"Perform the planned procedures — tests of controls and substantive tests — and collect sufficient appropriate evidence.",ar:"تنفيذ الإجراءات المخططة — اختبارات الرقابة والاختبارات الأساسية — وتجميع أدلة كافية ومناسبة.",out:"Audit evidence & working papers"},
    {n:4,t:"Reporting",tAr:"إعداد التقرير",en:"Evaluate the evidence, form the opinion and issue the written audit report to users.",ar:"تقييم الأدلة، تكوين الرأي، وإصدار تقرير المراجعة المكتوب.",out:"Written audit report"}],
  phaseNote:"Phase names are from the lecture (p. 11). The short descriptions of Phases 2–4 are additional professional explanation; the lecture details Phase 1 only.",
  topics:[
  { id:"t8", t:"The Four Phases of the External Audit", tAr:"المراحل الأربعة للمراجعة الخارجية", src:"L",
    concept:"Phases of external audit service: First — Acceptance of audit client engagement; Second — Planning the audit approach; Third — Field work implementing; Fourth — Reporting.",
    en:"The four phases are what make the audit a 'systematic process'. Each phase depends on the previous one: you cannot plan an audit you have not accepted, you cannot perform fieldwork without a plan, and you cannot report without evidence. Phase 1 decides whether the engagement should exist at all; the agreed terms are then confirmed in the Engagement Letter, which becomes the bridge into planning.",
    ar:"المراحل الأربعة دي هي اللي بتخلي المراجعة «systematic process». كل مرحلة مبنية على اللي قبلها: مينفعش تخطط لشغلانة لسه ما قبلتهاش، ومينفعش تنفذ من غير خطة، ومينفعش تكتب تقرير من غير أدلة. المرحلة الأولى بتقرر هل الارتباط هيحصل أصلاً، وبعدين الشروط المتفق عليها بتتأكد في خطاب الارتباط اللي بيعتبر الكوبري للتخطيط.",
    ex:"Hilyer and Riddle accept Babb Clothing in June 2016 (Phase 1), plan the audit, perform fieldwork on the year ending 31 December 2016, and finally issue a written report to Babb's board.",
    points:["1 Acceptance → 2 Planning → 3 Fieldwork → 4 Reporting","Sequential and dependent phases","Engagement Letter closes Phase 1"],
    q:"Name the four phases of the external audit process.",
    a:"Acceptance of the audit client engagement, planning the audit approach, fieldwork implementation, and reporting.",
    why:"These are the four phases shown in the lecture diagram on page 11."},
  { id:"t9", t:"Why Acceptance Comes First", tAr:"ليه القبول هو أول خطوة", src:"L",
    concept:"The first phase is deciding whether to accept the client; it includes four key steps.",
    en:"Acceptance protects the audit firm before any cost or liability is incurred. A firm that accepts a client with integrity problems, an unrealistic deadline, insufficient staff or unpaid fees risks a poor-quality audit, legal exposure and damage to reputation. That is why the lecture places four acceptance steps before planning begins.",
    ar:"القبول بيحمي مكتب المراجعة قبل ما يصرف أي مجهود أو يشيل أي مسؤولية. لو قبلت عميل عنده مشاكل نزاهة، أو ميعاد مستحيل، أو مفيش فريق كفاية، أو أتعاب مش متفق عليها — هتطلع مراجعة ضعيفة ومشاكل قانونية وسمعة سيئة. عشان كده الدكتورة حطت أربع خطوات للقبول قبل التخطيط.",
    ex:"A prospective client's previous auditor resigned after management refused access to bank statements. Discovering this in Phase 1 lets the firm decline before committing.",
    points:["Prevents problem clients","Protects quality, reputation and legal position","Four steps before planning"],
    q:"Why must the auditor complete the acceptance phase before planning?",
    a:"Because the auditor must first decide whether the engagement should be accepted at all — identifying problem clients, limitations, staffing and fee issues — before committing resources to planning the audit.",
    why:"It reflects the lecture's description of Phase 1 as 'deciding whether to accept the client'."}
  ]},
/* ───────────────────────── MODULE 3 ───────────────────────── */
{ id:"m3", no:3, t:"Client Acceptance", tAr:"قبول العميل",
  intro:"The four key steps of Phase 1, each with a practical example.",
  introAr:"الأربع خطوات بتوع المرحلة الأولى، كل واحدة بمثال عملي.",
  topics:[
  { id:"t10", t:"Step 1 — Evaluate the New or Existing Client", tAr:"الخطوة 1 — تقييم العميل الجديد أو الحالي", src:"L",
    concept:"Auditors should evaluate new or existing client entity before accepting the audit engagement — to help audit firms identify potential problem clients in advance, and any limitation that will be imposed on the auditor before accepting the engagement.",
    en:"Before accepting (or continuing with) a client, the auditor investigates who the client is: management integrity, financial condition, the industry, and — critically — any limitation that may be imposed on the auditor's work. The aim is to identify potential problems or limitations before the engagement is accepted, when the firm can still decline.",
    ar:"قبل ما تقبل العميل (أو تكمّل معاه لو هو عميل قديم) لازم تعرف هو مين: نزاهة الإدارة، وضعه المالي، طبيعة نشاطه، والأهم — هل في أي قيود (limitations) هتتفرض على شغلك. الهدف إنك تكتشف المشاكل «قبل» القبول، وقت ما لسه تقدر تقول لأ.",
    ex:"A new client says the auditor may not contact its customers to confirm balances. This is a limitation on scope identified in Step 1, and the firm may decline the engagement.",
    points:["Applies to new AND existing clients","Identify problem clients in advance","Identify limitations imposed on the auditor","Done before acceptance"],
    q:"What is the purpose of evaluating a new or existing client?",
    a:"To identify potential problem clients and any limitations that may be imposed on the auditor before the engagement is accepted.",
    why:"It restates the lecture text in red on page 11."},
  { id:"t11", t:"Step 2 — Identify the Reasons for the Audit", tAr:"الخطوة 2 — معرفة سبب المراجعة", src:"L",
    concept:"The auditor should identify the reasons why the client needs to be audited — as a regulatory requirement (listed firms), to apply for a bank loan, or to provide more information to interested users — as it affects planning of the audit in terms of time and effort.",
    en:"Why the client wants an audit tells the auditor who will rely on the report and how much is at stake. A listed company audited because of regulation, or a company audited to support a bank loan, will have external users relying heavily on the statements. More reliance generally means more care, time and effort. Hence the lecture links this step directly to planning time allocation and effort.",
    ar:"سبب المراجعة بيقولك مين اللي هيعتمد على التقرير وقد إيه الموضوع حساس. شركة مقيدة في البورصة بتتراجع بحكم القانون، أو شركة عايزة قرض من البنك — في الحالتين في مستخدمين خارجيين معتمدين جداً على القوائم. وكل ما الاعتماد يزيد، الوقت والمجهود يزيدوا. عشان كده الدكتورة ربطت الخطوة دي بالتخطيط من ناحية الوقت والمجهود.",
    ex:"A company needs audited statements to obtain an EGP 50 million bank loan. The auditor expects the bank to rely on the report and plans more time on receivables, inventory and debt covenants.",
    points:["Regulatory requirement (listed firms)","Bank loan requirement","More information to users","Affects time and effort in planning"],
    q:"Give two examples of reasons why a client needs an audit, and explain why the reason matters.",
    a:"For example, compliance with a legal requirement such as a bank loan condition, or providing more information to users. The reason matters because it determines who will rely on the statements and therefore the time and effort the auditor must plan.",
    why:"Uses the lecture's own examples and its stated consequence: planning time allocation and effort."},
  { id:"t12", t:"Step 3 — Assign Appropriate Staff", tAr:"الخطوة 3 — اختيار الفريق المناسب", src:"L",
    concept:"The auditor must make sure he has the required qualification and skills to perform the audit and skilled staff available in time to perform the audit on the agreed upon date.",
    en:"Acceptance is only responsible if the firm can actually do the job well. That means the right qualifications (e.g. industry knowledge, IT skills), enough skilled people, and availability on the agreed dates. Accepting an engagement without competent staff threatens audit quality and may breach professional standards.",
    ar:"مينفعش تقبل شغلانة وانت مش قدّها. لازم يكون عندك المؤهلات والمهارات (زي خبرة في الصناعة أو IT)، وعدد كافي من الناس الكويسين، ويكونوا فاضيين في المواعيد المتفق عليها. لو قبلت من غير فريق كفء، الجودة هتقع وممكن تخالف المعايير المهنية.",
    ex:"A small firm is invited to audit a bank but has no staff experienced in banking regulations or loan-loss estimates. It should hire specialists or decline.",
    points:["Qualifications and skills","Skilled staff available","Available on the agreed date"],
    q:"What does 'assigning appropriate staff' require?",
    a:"Ensuring the audit team has the right qualifications, skills and availability to perform the audit properly by the agreed date.",
    why:"Matches the lecture's highlighted summary for Step 3."},
  { id:"t13", t:"Step 4 — Agree on the Audit Fees", tAr:"الخطوة 4 — الاتفاق على الأتعاب", src:"L",
    concept:"The auditor should negotiate and accept the fees assigned to the audit process before accepting the audit engagement.",
    en:"Fees are agreed before acceptance so that both parties understand the commercial terms and the auditor has enough budget to do a proper audit. In the Babb letter this step appears as the fee paragraph: fees billed as work progresses, based on time at various levels of responsibility plus out-of-pocket expenses, with an initial estimate of $135,000.",
    ar:"الأتعاب لازم تتحدد قبل القبول عشان الطرفين يبقوا فاهمين الاتفاق، وعشان المراجع يبقى عنده ميزانية تكفي يعمل شغل كويس. وفي خطاب Babb الخطوة دي ظاهرة في فقرة الأتعاب: بتتحسب على حسب تقدّم الشغل، وعلى أساس الوقت بمستويات المسؤولية المختلفة + المصاريف الفعلية، والتقدير المبدئي $135,000.",
    ex:"Hilyer and Riddle estimate total fees of $135,000 and promise to notify the client immediately of circumstances that could significantly change that estimate.",
    points:["Negotiate before acceptance","Avoid later disputes","Ensures adequate resources","Reflected in the Engagement Letter fee clause"],
    q:"Why are audit fees agreed before accepting the engagement?",
    a:"So that the auditor and client agree on the commercial terms in advance, avoiding later disputes and ensuring the auditor has adequate resources to perform the audit properly.",
    why:"Builds on the lecture's Step 4 and links it to the actual fee clause in the case letter."}
  ]},
/* ───────────────────────── MODULE 4 ───────────────────────── */
{ id:"m4", no:4, t:"Engagement Letter — Definition", tAr:"خطاب الارتباط — التعريف",
  intro:"What the Engagement Letter is, who issues it, when, and why the client signs it.",
  introAr:"خطاب الارتباط إيه، مين بيكتبه، إمتى، وليه العميل بيمضي عليه.",
  topics:[
  { id:"t14", t:"What Is the Engagement Letter?", tAr:"يعني إيه خطاب الارتباط؟", src:"L",
    concept:"\"We are pleased to confirm our acceptance and our understanding of this audit engagement by means of this letter.\" — Engagement Letter, Babb Clothing Co. (lecture p. 13)",
    en:"The Engagement Letter is a written agreement, prepared by the auditor and addressed to the client, that confirms the auditor's acceptance of the engagement and documents the agreed terms: objective, scope, standards, responsibilities of both parties, fees, and the expected report. In the lecture example it is prepared by Hilyer and Riddle, CPAs, and addressed to Mr. Chuck Milsaps, President of Babb Clothing Co., dated June 14, 2016 — before the year-end of December 31, 2016. The client signs and returns a copy to show acknowledgement and agreement.",
    ar:"خطاب الارتباط هو اتفاق مكتوب، المراجع هو اللي بيكتبه وبيبعته للعميل، بيأكد إن المراجع قبل الشغلانة وبيوثّق الشروط: الهدف، النطاق، المعايير، مسؤوليات كل طرف، الأتعاب، والتقرير المتوقع. في مثال المحاضرة: Hilyer and Riddle, CPAs بعتوه لـ Mr. Chuck Milsaps رئيس Babb Clothing Co. بتاريخ 14 يونيو 2016 — يعني قبل نهاية السنة المالية 31 ديسمبر 2016. والعميل بيمضي على نسخة ويرجّعها كدليل إنه موافق.",
    ex:"Who prepares? the auditor (Hilyer and Riddle). Who receives? the client's president (Mr. Milsaps). When? after acceptance, before the audit work — June 14, 2016.",
    points:["Prepared by the auditor","Addressed to the client (management)","Issued after acceptance, before planning/fieldwork","Confirms acceptance + understanding of terms","Signed and returned by the client"],
    q:"What is the Engagement Letter, and who prepares and receives it?",
    a:"It is a written agreement prepared by the auditor and sent to the client that confirms acceptance of the audit engagement and the agreed terms — objective, scope, responsibilities, fees and reporting. The client signs and returns it to show agreement.",
    why:"Every element is visible in the lecture's letter: the CPA firm writes it, the president of Babb receives it, and the final paragraph asks him to sign and return it."},
  { id:"t15", t:"Why Is the Engagement Letter Important?", tAr:"ليه خطاب الارتباط مهم؟", src:"L",
    concept:"\"Please sign and return the attached copy of this letter to indicate your acknowledgement of, and agreement with, the arrangements for our audit of the financial statements including our respective responsibilities.\"",
    en:"The letter has a professional purpose and a legal (contractual) purpose. Professionally, it prevents misunderstandings — the 'expectation gap' — by stating clearly that the audit gives reasonable, not absolute, assurance; that management, not the auditor, prepares the statements and maintains internal control; and that an unmodified opinion is not guaranteed. Legally, once signed it is evidence of the agreed contract terms (scope, fees, responsibilities) and can protect both parties in a dispute. It also closes the acceptance phase: the four acceptance decisions become written terms.",
    ar:"الخطاب ليه غرضين: مهني وقانوني. مهنياً: بيمنع سوء الفهم أو اللي بنسميه «expectation gap» — بيقول بوضوح إن المراجعة بتدّي تأكيد معقول مش مطلق، وإن الإدارة (مش المراجع) هي اللي بتعد القوائم ومسؤولة عن الرقابة الداخلية، وإن الرأي النظيف مش مضمون. قانونياً: بعد ما العميل يمضي، الخطاب بيبقى دليل على شروط التعاقد (النطاق، الأتعاب، المسؤوليات) وبيحمي الطرفين لو حصل خلاف. وكمان هو اللي بيقفل مرحلة القبول: قرارات القبول الأربعة بتتحول لشروط مكتوبة.",
    ex:"After a fraud is discovered, the client claims the auditor 'guaranteed' accurate statements. The signed letter shows the client agreed that the audit provides reasonable assurance and that an unavoidable risk of undetected misstatement exists.",
    points:["Prevents misunderstanding (expectation gap)","Defines respective responsibilities","Contractual evidence of terms and fees","Links acceptance to planning","Client signature = acknowledgement + agreement"],
    q:"Why does the auditor ask the client to sign and return the Engagement Letter?",
    a:"To obtain written evidence that the client acknowledges and agrees with the audit arrangements, including the respective responsibilities of management and the auditor. This reduces misunderstandings and protects both parties.",
    why:"It paraphrases the final paragraph of the actual letter and states its practical effect."},
  { id:"t16", t:"Connection to Client Acceptance", tAr:"علاقته بقبول العميل", src:"L",
    concept:"Phase 1 four steps: evaluate client · identify reasons for audit · assign staff · agree fees → confirmed in the Engagement Letter.",
    en:"Each acceptance step leaves a trace in the letter. Evaluating the client and possible limitations → the letter requires unrestricted access to information and persons. Identifying the reasons for the audit → the letter identifies the statements covered and that the report is addressed to the board of directors. Assigning staff → fees are based on time at 'various levels of responsibility'. Agreeing fees → the $135,000 estimate and billing terms. In short, the Engagement Letter is the written result of the acceptance phase.",
    ar:"كل خطوة من خطوات القبول ليها أثر في الخطاب. تقييم العميل والقيود → الخطاب بيشترط الوصول الكامل للمعلومات والأشخاص. سبب المراجعة → الخطاب بيحدد القوائم المشمولة وإن التقرير لمجلس الإدارة. اختيار الفريق → الأتعاب محسوبة على الوقت بـ «مستويات المسؤولية المختلفة». الاتفاق على الأتعاب → تقدير $135,000 وطريقة الفوترة. باختصار: خطاب الارتباط هو النتيجة المكتوبة لمرحلة القبول.",
    ex:"If, during Step 1, management had refused unrestricted access, the auditor could not have issued the letter in its standard form.",
    points:["Letter = written outcome of Phase 1","Each step maps to a clause","Issued before planning begins"],
    q:"How is the Engagement Letter connected to the client-acceptance phase?",
    a:"It is the written outcome of the acceptance phase: once the auditor has evaluated the client, understood the reasons for the audit, assigned staff and agreed fees, those decisions are confirmed in the letter, which the client signs before the audit is planned.",
    why:"It connects the lecture's four steps (pp. 11–12) with the letter on pp. 13–14."}
  ]},

{ id:"m6", no:6, t:"Management vs Auditor", tAr:"الإدارة مقابل المراجع",
  intro:"Who does what — the most tested distinction in the Engagement Letter.",
  introAr:"مين بيعمل إيه — أكتر نقطة بتيجي في الامتحان والمناقشة.",
  topics:[
  { id:"t18", t:"Management's Responsibilities", tAr:"مسؤوليات الإدارة", src:"L",
    concept:"\"Our audit will be conducted on the basis that management acknowledges and understands that they have responsibility (a) for the preparation and fair presentation of the financial statements … (b) for the design, implementation, and maintenance of internal control … (c) to provide us with access to all information …, additional information …, and unrestricted access to persons …\"",
    en:"The letter states that the audit is conducted 'on the basis that' management accepts these responsibilities — they are a precondition of the audit. Management prepares and fairly presents the statements under US GAAP; designs, implements and maintains internal control; and gives the auditor access to all relevant information, any additional information requested, and unrestricted access to people. The auditor does not take over any of these — otherwise the auditor would be auditing its own work and lose independence.",
    ar:"الخطاب بيقول إن المراجعة هتتم «على أساس» إن الإدارة معترفة بالمسؤوليات دي — يعني دي شرط أساسي للمراجعة. الإدارة هي اللي بتعد القوائم وتعرضها بعدالة حسب US GAAP، وهي اللي بتصمم وتطبق وتحافظ على الرقابة الداخلية، وهي اللي لازم تدّي المراجع كل المعلومات، وأي معلومات إضافية يطلبها، ووصول بلا قيود للأشخاص. المراجع مبياخدش أي حاجة من دول — وإلا هيبقى بيراجع شغله هو ويفقد استقلاله.",
    ex:"The finance manager asks the auditor to 'prepare the year-end adjustments and the statements'. Under the letter, preparation is management's responsibility.",
    points:["Prepare & fairly present FS (US GAAP)","Design, implement, maintain internal control","Provide all relevant information","Provide additional information requested","Unrestricted access to persons","These are preconditions for the audit"],
    q:"List management's responsibilities stated in the Engagement Letter.",
    a:"Management is responsible for preparing and fairly presenting the financial statements under the applicable framework, for designing, implementing and maintaining relevant internal control, and for giving the auditor access to all relevant information, additional information requested, and unrestricted access to persons within the entity.",
    why:"It mirrors items a, b and c (i–iii) of the actual letter."},
  { id:"t19", t:"The Auditor's Responsibilities", tAr:"مسؤوليات المراجع", src:"L",
    concept:"\"Those standards require that we plan and perform the audit to obtain reasonable assurance about whether the financial statements are free from material misstatement.\"",
    en:"The auditor's responsibilities in the letter are: conduct the audit in accordance with GAAS; plan and perform it to obtain reasonable assurance; perform procedures to obtain audit evidence; assess the risks of material misstatement due to fraud or error; evaluate accounting policies, significant estimates and overall presentation; consider internal control to design procedures; communicate significant deficiencies or material weaknesses in writing; and express an independent opinion in a written report.",
    ar:"مسؤوليات المراجع في الخطاب: يراجع حسب GAAS، يخطط وينفذ عشان يوصل لتأكيد معقول، يعمل إجراءات ويجمع أدلة، يقيّم مخاطر التحريف الجوهري سواء غش أو خطأ، يقيّم السياسات المحاسبية والتقديرات المهمة والعرض العام، يفهم الرقابة الداخلية عشان يصمم الإجراءات، يبلّغ كتابةً عن نقاط الضعف المهمة في الرقابة، وفي الآخر يدّي رأي مستقل في تقرير مكتوب.",
    ex:"The auditor tests a sample of sales invoices, evaluates the warranty provision estimate, and reports a material weakness in cash controls to management in writing.",
    points:["Perform audit under GAAS","Assess risks","Obtain audit evidence","Evaluate policies, estimates, presentation","Obtain reasonable assurance","Express independent opinion"],
    q:"What is the auditor responsible for under the Engagement Letter?",
    a:"Performing the audit in accordance with GAAS to obtain reasonable assurance that the statements are free from material misstatement — assessing risks, obtaining evidence, evaluating accounting policies, estimates and presentation, communicating significant control deficiencies, and expressing an independent opinion in a written report.",
    why:"Each responsibility is taken from paragraphs 2, 4 and 9 of the letter."}
  ]},

{ id:"m7", no:7, t:"Reasonable Assurance", tAr:"التأكيد المعقول",
  intro:"Why the auditor gives reasonable, not absolute, assurance — and how it differs from limited assurance.",
  introAr:"ليه المراجع بيدّي تأكيد معقول مش مطلق — وإيه الفرق بينه وبين التأكيد المحدود.",
  topics:[
  { id:"t20", t:"Reasonable vs Absolute vs Limited Assurance", tAr:"تأكيد معقول / مطلق / محدود", src:"L+A",
    concept:"The auditor is responsible for reasonable, but not absolute assurance. (Lecture p. 4) — Limited assurance (review engagements) is additional professional material; the lecture's in-class assignment refers to reviews and negative assurance.",
    en:"Reasonable assurance is a high, but not absolute, level of assurance obtained in an audit; it supports a positive opinion ('presents fairly, in all material respects'). Absolute assurance would mean 100% certainty that the statements contain no misstatement — no audit can provide this. Limited assurance is a lower level obtained in a review, mainly through inquiry and analytical procedures, and leads to a negatively worded conclusion ('nothing has come to our attention…'). Reasonable assurance is a professional concept, not a fixed percentage.",
    ar:"Reasonable assurance = درجة تأكيد «عالية» بس مش مطلقة، ودي اللي بتطلع من المراجعة الكاملة (audit) وبتدّي رأي بصيغة إيجابية (presents fairly). Absolute assurance = يقين 100% إن مفيش أي خطأ — ومفيش مراجعة في الدنيا تقدر تدّي ده. Limited assurance = درجة أقل بتطلع من الفحص المحدود (review) — أساساً استفسارات وإجراءات تحليلية — وبتطلع نتيجة بصيغة سلبية «ما نما إلى علمنا ما يجعلنا نعتقد…». وخلي بالك: الـ reasonable assurance مفهوم مهني، مش نسبة مئوية ثابتة.",
    ex:"Annual audit of Babb Clothing → reasonable assurance, positive opinion. Quarterly interim review of a listed company → limited assurance, negative-form conclusion.",
    points:["Reasonable = high, not absolute","Absolute = impossible / impractical","Limited = review, negative assurance","Never express reasonable assurance as a number"],
    q:"Distinguish between reasonable, absolute and limited assurance.",
    a:"Reasonable assurance is the high but not absolute level provided by an audit, supporting a positive opinion. Absolute assurance would be complete certainty, which no audit can give. Limited assurance is the lower level provided by a review, expressed as a negative conclusion.",
    why:"Correctly ranks the three levels and links each to its engagement type and form of reporting."},
  { id:"t21", t:"Four Reasons Assurance Is Not Absolute", tAr:"أربع أسباب إن التأكيد مش مطلق", src:"L",
    concept:"(1) Most audit evidence results from testing a sample… (2) Accounting presentations contain complex estimates… (3) Fraudulently prepared financial statements are often extremely difficult, if not impossible, to detect, especially when there is collusion among management. (4) If auditors were responsible for making certain that all assertions were 100% correct, the cost would increase to such an extent that audits would not be economically practical.",
    en:"Memorise four words: SAMPLE, ESTIMATES, FRAUD, COST. Sampling: the auditor tests part of a population (e.g. receivables, inventory), so there is always a risk that a misstatement sits in the untested part. Estimates: warranties, impairment and provisions depend on future events, so even a well-supported estimate can turn out wrong. Fraud and collusion: people who conspire can forge documents and override controls, hiding evidence from the auditor. Cost: testing 100% of everything would make audits so expensive they would not be economically practical.",
    ar:"احفظ أربع كلمات: SAMPLE – ESTIMATES – FRAUD – COST. العيّنة: المراجع بيختبر جزء بس من المجتمع (زي العملاء أو المخزون)، فدايماً في احتمال إن الغلط يكون في الجزء اللي ما اتختبرش. التقديرات: الضمان والاضمحلال والمخصصات مبنية على أحداث مستقبلية، فحتى التقدير المعقول ممكن يطلع غلط. الغش والتواطؤ: لما مجموعة يتفقوا مع بعض يقدروا يزوّروا مستندات ويتخطوا الرقابة ويخبّوا الدليل. التكلفة: لو هنفحص 100% من كل حاجة المراجعة هتبقى غالية جداً ومش عملية اقتصادياً.",
    ex:"Lecture case (XYZ Co.): sample of receivables; complex estimates for warranty and impairment; suspected collusion between employees and management; 100% testing extremely costly — all four limitations in one scenario.",
    points:["Sampling risk","Complex estimates → uncertainty","Fraud + collusion → hard to detect","100% testing not economically practical"],
    q:"Why can't the auditor provide absolute assurance?",
    a:"Because evidence is mostly obtained by sampling, financial statements contain complex estimates that involve uncertainty, fraud — especially with collusion — is very difficult to detect, and verifying everything with 100% certainty would make the audit economically impractical.",
    why:"These are the exact four reasons on page 4 of the lecture and the basis of the XYZ case study."},
  { id:"t22", t:"Inherent Limitations in the Letter", tAr:"القيود الطبيعية في الخطاب", src:"L",
    concept:"\"Because of the inherent limitations of an audit, together with the inherent limitations of internal control, an unavoidable risk that some material misstatements may not be detected exists, even though the audit is properly planned and performed in accordance with GAAS.\"",
    en:"This paragraph puts the four reasons into the contract. It warns the client — in writing, before the audit starts — that even a properly planned and performed GAAS audit carries an unavoidable risk that some material misstatements will not be detected. It also mentions the inherent limitations of internal control (e.g. human error, management override, collusion). Including it manages expectations and protects the auditor against a claim that the audit 'should have found everything'.",
    ar:"الفقرة دي بتحوّل الأربع أسباب لشرط مكتوب في العقد. بتنبّه العميل — كتابةً وقبل ما الشغل يبدأ — إن حتى لو المراجعة متخططة ومتنفذة صح حسب GAAS، فيه خطر «لا يمكن تجنبه» إن شوية تحريفات جوهرية ما تتكتشفش. وكمان بتذكر القيود الطبيعية للرقابة الداخلية (خطأ بشري، تجاوز الإدارة، تواطؤ). وجودها بيظبط التوقعات وبيحمي المراجع من ادعاء إنه «كان لازم يلاقي كل حاجة».",
    ex:"Two employees and the sales manager collude to record fictitious sales with forged documents. Even a properly performed audit may not detect this; the letter has already disclosed this risk.",
    points:["Unavoidable risk of undetected material misstatement","Exists even in a properly performed GAAS audit","Covers limits of audit AND of internal control","Manages expectations; protects auditor"],
    q:"What does the inherent-limitations paragraph tell the client?",
    a:"That because of the inherent limitations of an audit and of internal control, there is an unavoidable risk that some material misstatements may not be detected, even when the audit is properly planned and performed in accordance with GAAS.",
    why:"It is a faithful summary of paragraph 3 of the real letter."}
  ]},
