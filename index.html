  { id:"p5", label:"Paragraph 5 — Management's responsibilities & access",
    segs:[["Our audit will be conducted on the basis that management acknowledges and understands that they have responsibility a. for the preparation and fair presentation of the financial statements in accordance with accounting principles generally accepted in the United States of America; b. for the design, implementation, and maintenance of internal control relevant to the preparation and fair presentation of financial statements that are free of material misstatement, whether due to fraud or error; and","c13"],
          [" c. to provide us with i. access to all information of which management is aware that is relevant to the preparation and fair presentation of the financial statements such as records, documentation, and other matters; ii. additional information that we may request from management for the purpose of the audit; and iii. unrestricted access to persons within the entity from whom we determine it necessary to obtain audit evidence.","c14"]],
    means:"Sets out the preconditions of the audit: management is responsible for the statements (US GAAP), for internal control, and for giving the auditor full access to information and people.",
    meansAr:"بيحدد الشروط الأساسية للمراجعة: الإدارة مسؤولة عن القوائم (US GAAP)، وعن الرقابة الداخلية، وعن إنها تدّي المراجع وصول كامل للمعلومات والأشخاص.",
    why:"To make the division of responsibility explicit and to secure the access the auditor needs to obtain sufficient evidence.",
    req:"Management: prepare FS, maintain internal control, provide information, additional information, and unrestricted access to persons.",
    q:"What does 'on the basis that management acknowledges' mean?",
    a:"It means the audit depends on management accepting these responsibilities; they are preconditions. If management refused them, the audit could not be properly performed."},
  { id:"p6", label:"Paragraph 6 — Written representations",
    segs:[["As part of our audit process, we will request from management written confirmation concerning representations made to us in connection with the audit.","c15"]],
    means:"At the end of the audit, management will be asked to confirm in writing the representations it made to the auditor.",
    meansAr:"في آخر المراجعة، الإدارة هيتطلب منها تأكد كتابةً على الإفادات اللي قالتها للمراجع.",
    why:"To obtain written evidence of management's oral explanations and its acknowledgement of responsibility; it does not replace other evidence.",
    req:"Management: provide a written representation letter when requested.",
    q:"Why does the auditor request written representations from management?",
    a:"To obtain written confirmation of representations made during the audit, which documents management's responsibility and supports — but does not replace — other audit evidence."},
  { id:"p7", label:"Paragraph 7 — Additional service (tax returns)",
    segs:[["As part of our engagement for the year ending December 31, 2016, we will also prepare the federal and state income tax returns for Babb Clothing Co.","c16"]],
    means:"In addition to the audit, the firm will prepare Babb's federal and state income tax returns for the year ending December 31, 2016.",
    meansAr:"بالإضافة للمراجعة، المكتب هيعدّ الإقرارات الضريبية الفيدرالية والولاية لـ Babb عن السنة المنتهية 31 ديسمبر 2016.",
    why:"Every service agreed must be documented so that scope and fees are clear.",
    req:"Auditor: prepare the federal and state income tax returns. Management: provide the information needed.",
    q:"Is tax-return preparation part of the audit opinion?",
    a:"No. It is an additional, separate service included in the engagement; the audit opinion covers the financial statements."},
  { id:"p8", label:"Paragraph 8 — Fees & billing",
    segs:[["Our fees will be billed as work progresses and are based on the amount of time required at various levels of responsibility, plus actual out-of-pocket expenses. Invoices are payable upon presentation. We will notify you immediately of any circumstances we encounter that could significantly affect our initial estimate of total fees of $135,000.","c17"]],
    means:"Fees are time-based by staff level, plus actual expenses, billed progressively and payable on presentation; the initial estimate is $135,000, and the client will be told immediately of anything that may significantly change it.",
    meansAr:"الأتعاب محسوبة بالوقت حسب مستوى كل فرد في الفريق + المصاريف الفعلية، بتتفوتر مع تقدّم الشغل وتتدفع أول ما الفاتورة تتقدم؛ والتقدير المبدئي $135,000، ولو ظهر أي حاجة ممكن تغيّره بشكل كبير المراجع هيبلّغ فوراً.",
    why:"Implements acceptance Step 4 (agree fees) and avoids fee disputes.",
    req:"Management: pay invoices on presentation. Auditor: notify immediately of circumstances significantly affecting the estimate.",
    q:"Is $135,000 a fixed fee?",
    a:"No. It is an initial estimate of total fees; fees are based on time and actual expenses, and the auditor will notify the client of circumstances that could significantly affect the estimate."},
  { id:"p9", label:"Paragraph 9 — Report & possible modification",
    segs:[["We will issue a written report upon completion of our audit of Babb Clothing Co.'s financial statements. Our report will be addressed to the board of directors of Babb Clothing Co.","c18"],
          [" We cannot provide assurance that an unmodified opinion will be expressed. Circumstances may arise in which it is necessary for us to modify our opinion, add an emphasis-of-matter or other-matter paragraph(s), or withdraw from the engagement.","c19"]],
    means:"The deliverable is a written report to the board of directors. The auditor does not promise a clean (unmodified) opinion and may modify the opinion, add emphasis-of-matter/other-matter paragraphs, or withdraw.",
    meansAr:"الناتج النهائي تقرير مكتوب لمجلس الإدارة. المراجع مش بيوعد برأي نظيف (unmodified)، وممكن يعدّل الرأي، أو يضيف فقرة لفت انتباه أو فقرة أمور أخرى، أو حتى ينسحب.",
    why:"To protect the auditor's independence: the opinion depends on the evidence, not on the client's wishes.",
    req:"Auditor: issue the written report; modify or withdraw when circumstances require.",
    q:"Can the client require the auditor to guarantee an unmodified opinion?",
    a:"No. The letter states that the auditor cannot provide assurance that an unmodified opinion will be expressed; the opinion depends on the audit evidence."},
  { id:"p10", label:"Paragraph 10 — Acknowledgement & agreement",
    segs:[["Please sign and return the attached copy of this letter to indicate your acknowledgement of, and agreement with, the arrangements for our audit of the financial statements including our respective responsibilities.","c20"]],
    means:"The client signs and returns a copy to confirm it acknowledges and agrees with the arrangements and the respective responsibilities.",
    meansAr:"العميل بيمضي على نسخة ويرجعها عشان يأكد إنه فاهم وموافق على الترتيبات والمسؤوليات الخاصة بكل طرف.",
    why:"Turns the letter into a mutually agreed document and written evidence of the terms.",
    req:"Management: sign and return the copy.",

 defs:[["Engagement Letter","Written agreement confirming acceptance and terms of the audit."],["Reasonable assurance","High but not absolute level of assurance."],["Material misstatement","Misstatement that could influence users' decisions."],["Management assertions","Management's implicit claims in the financial statements."],["Applicable framework","Criteria for measuring the assertions (EAS, IFRS, GAAP, laws)."],["GAAS","Auditing standards the auditor follows."],["Written representations","Management's written confirmation of representations made."],["Inherent limitations","Factors that make absolute assurance impossible."]],
 checklist:{mgmt:["Prepare and fairly present FS under US GAAP","Design, implement and maintain internal control","Provide all relevant information","Provide additional information requested","Give unrestricted access to persons","Provide written representations","Sign and return the letter"],
            aud:["Conduct audit under US GAAS","Plan and perform for reasonable assurance","Assess risks of material misstatement (fraud or error)","Obtain audit evidence","Evaluate policies, estimates, presentation","Communicate significant control deficiencies in writing","Prepare tax returns (additional service)","Notify client of significant fee changes","Issue written report to the board"]},

 must:[
  {tier:"Critical — expect it",items:["Definition, preparer, recipient and timing of the Engagement Letter","Management vs auditor responsibilities","Reasonable vs absolute assurance + four reasons","GAAS vs GAAP","Why the client signs and returns the letter"]},
  {tier:"High — likely follow-ups",items:["Inherent limitations paragraph","Internal control: considered, not opined on","Unmodified opinion not guaranteed","Access clauses c(i)–(iii)","Four acceptance steps and their link to the letter"]},
  {tier:"Supporting — shows depth",items:["Case facts: names, dates, $135,000, tax returns, board","Written representations","Fraud vs error; material vs immaterial","Engagement letter vs representation letter","Five management assertions"]}],
 rapid:["Letter = auditor writes, client signs.","Issued after acceptance, before planning.","Objective = opinion on the FS.","GAAS = audit; GAAP = preparation.","Reasonable ≠ absolute; no percentage.","Sample · Estimates · Fraud · Cost.","Unavoidable risk even in a proper audit.","Internal control: considered, not opined on.","Management: prepare, control, access.","Written reps support — never replace — evidence.","Tax returns = additional service.","$135,000 = initial estimate.","Report → board of directors.","Unmodified opinion not guaranteed.","Signature = acknowledgement + agreement."],
 script2:"Good morning. The engagement letter is a written agreement that the auditor prepares and the client signs at the end of the acceptance phase, before the audit is planned. In our lecture example, Hilyer and Riddle, CPAs, send it to Mr. Chuck Milsaps, President of Babb Clothing Company, on June 14, 2016, for the year ending December 31, 2016.\n\nThe letter does three things. First, it confirms acceptance and defines the engagement: the balance sheet, income statement, changes in stockholders' equity, cash flows and notes, with the objective of expressing an opinion. Second, it explains how the audit works: under US GAAS, aiming at reasonable — not absolute — assurance that the statements are free from material misstatement, whether due to fraud or error. It also warns that, because of inherent limitations, some material misstatements may not be detected.\n\nThird, it divides responsibilities. Management prepares the statements under US GAAP, maintains internal control and gives full access to information and people. The auditor obtains evidence, communicates control weaknesses and issues a written report to the board, without guaranteeing an unmodified opinion. Fees are estimated at $135,000, and tax returns are an additional service. Finally, the client signs and returns the letter to show agreement. In short, the letter prevents misunderstanding and protects both parties.",
 script5:[
  {h:"1. Opening & definition (30 s)",en:"Today I will explain the engagement letter, using the real example from our lecture. An engagement letter is a written agreement, prepared by the auditor and signed by the client, that confirms the auditor's acceptance of the engagement and records the agreed terms and responsibilities.",ar:"قبل ما تقول الجزء ده لازم تكون فاهم: المراجع بيكتب، العميل بيمضي، والهدف تأكيد القبول والشروط."},
  {h:"2. Where it fits in the audit process (40 s)",en:"The external audit has four phases: acceptance, planning, fieldwork and reporting. In the acceptance phase the auditor evaluates the client, identifies why it needs an audit, assigns the right staff and agrees fees. The engagement letter is the written result of these decisions, issued before planning starts.",ar:"افهم إن الخطاب هو «نتيجة» مرحلة القبول. لو الدكتورة قاطعتك بسؤال عن الخطوات الأربعة تكون جاهز."},
  {h:"3. The case facts (40 s)",en:"In the lecture, Hilyer and Riddle, CPAs, of Macon, Georgia, send the letter to Mr. Chuck Milsaps, President of Babb Clothing Company, on June 14, 2016. The audit covers the balance sheet at December 31, 2016, the statements of income, changes in stockholders' equity and cash flows, and the notes.",ar:"احفظ الأسماء والتاريخين كويس. ده بيدّي انطباع إنك قريت الخطاب فعلاً."},
  {h:"4. Objective, standards and assurance (60 s)",en:"The objective is to express an opinion on the financial statements. The audit follows US GAAS, which require the auditor to obtain reasonable assurance that the statements are free from material misstatement, whether due to fraud or error. The auditor selects procedures by professional judgment and risk assessment, and evaluates accounting policies, significant estimates and the overall presentation. Reasonable assurance is high but not absolute, because evidence is based on samples, statements include complex estimates, collusive fraud is hard to detect, and testing everything would not be economically practical. The letter therefore warns that some material misstatements may not be detected even in a properly performed audit.",ar:"ده أهم جزء. افهم الفرق بين GAAS وGAAP، والأربع أسباب، ومعنى «unavoidable risk». متقولش أي نسبة مئوية."},
  {h:"5. Internal control (30 s)",en:"The auditor considers internal control to design suitable procedures, but does not give an opinion on its effectiveness. However, any significant deficiencies or material weaknesses found will be communicated in writing.",ar:"خلي بالك: المراجع «بيدرس» الرقابة مش «بيشهد» عليها."},
  {h:"6. Management's responsibilities (50 s)",en:"The audit is conducted on the basis that management accepts its responsibilities: preparing and fairly presenting the statements under US GAAP; designing, implementing and maintaining internal control; and providing all relevant information, any additional information requested, and unrestricted access to people. At the end, management also gives written representations.",ar:"«on the basis that» = شرط مسبق. عدّ المسؤوليات على صوابعك: إعداد – رقابة – معلومات – معلومات إضافية – أشخاص – إقرارات."},
  {h:"7. Additional service and fees (30 s)",en:"The firm will also prepare Babb's federal and state income tax returns. Fees are billed as work progresses, based on time at different levels of responsibility plus actual expenses, with an initial estimate of $135,000; the client will be told immediately if that estimate may change significantly.",ar:"$135,000 تقدير مبدئي مش رقم ثابت، والضرايب خدمة إضافية منفصلة عن الرأي."},
  {h:"8. Report and possible modification (30 s)",en:"On completion, the auditor issues a written report addressed to the board of directors. The auditor cannot promise an unmodified opinion; it may need to modify the opinion, add an emphasis-of-matter or other-matter paragraph, or withdraw.",ar:"افرق بين المرسل إليه الخطاب (الرئيس) والمرسل إليه التقرير (مجلس الإدارة)."},
  {h:"9. Conclusion (20 s)",en:"Finally, the client signs and returns a copy to acknowledge and agree. So the engagement letter protects both parties: it sets clear expectations, defines responsibilities and provides written evidence of the agreement. Thank you.",ar:"اختم بجملة الحماية للطرفين. خليك هادي ومتسرعش في الختام."}]
};

var QT="mcq",QI={mcq:0,tf:0,mock:0,cases:0},RETRY={mcq:null,tf:null},PICK={};
function bank(t){return t==="mcq"?ZT.mcq:ZT.tf.map(function(x){return {q:x.q,o:["True","False"],a:x.a?0:1,ex:x.ex,src:x.src};});}
R.quiz=function(opt){
  if(opt&&opt.tab)QT=opt.tab;
  var tabs=[["mcq","Multiple choice ("+ZT.mcq.length+")"],["tf","True / False ("+ZT.tf.length+")"],["mock","Oral discussion ("+ZT.mock.length+")"],["cases","Practical cases ("+ZT.cases.length+")"]];
  $("#v-quiz").innerHTML='<div class="secthead"><div><div class="eyebrow">Mode 4</div><h1 style="margin:0">Practice quizzes</h1></div></div><div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="gbtn sm '+(t[0]===QT?'':'light')+'" role="tab" aria-selected="'+(t[0]===QT)+'" data-qt="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div><div id="qbody"></div>';
  $$("[data-qt]").forEach(function(b){b.onclick=function(){QT=b.dataset.qt;PICK.hold=false;R.quiz();};});
  if(QT==="mcq"||QT==="tf")renderBank(QT);else if(QT==="mock")renderMock();else renderCases();
};
function bankStats(t){var b=S.bank[t],B=bank(t),a=0,c=0;for(var k in b){a++;if(b[k].ok)c++;}return {a:a,c:c,n:B.length};}
function renderBank(t){
  var B=bank(t),st=bankStats(t),list=RETRY[t]||B.map(function(_,i){return i;});
  if(st.a===st.n&&!RETRY[t]&&!PICK.review&&!PICK.hold){return renderSummary(t);}
  var pos=Math.min(QI[t],list.length-1),qi=list[pos],q=B[qi],rec=S.bank[t][qi],letters="ABCD";
  var sel=PICK[t+qi];
  var opts=q.o.map(function(o,j){var cls="",pressed=false;if(rec){if(j===q.a)cls="right";else if(j===rec.sel)cls="wrong";}else if(sel===j)pressed=true;
    return '<button class="opt '+cls+'" data-j="'+j+'" aria-pressed="'+pressed+'"'+(rec?' disabled':'')+'><span class="let">'+(t==="tf"?(j?"F":"T"):letters[j])+'</span><span>'+E(o)+'</span></button>';}).join("");
  var fb=rec?'<div class="feedback '+(rec.ok?'good':'badf')+'"><b>'+(rec.ok?'✓ Correct.':'✗ Incorrect.')+'</b> Correct answer: <b>'+(t==="tf"?q.o[q.a]:letters[q.a]+') '+E(q.o[q.a]))+'</b><br>'+E(q.ex)+'</div>':'';
  $("#qbody").innerHTML='<div class="quizgrid"><div class="glass qcard"><div class="row"><span class="eyebrow">'+(RETRY[t]?'Retry incorrect · ':'')+'Question '+(pos+1)+' of '+list.length+'</span><span class="spacer"></span>'+srcChip(q.src||"L")+'</div><h2 style="margin-top:12px;font-size:1.3rem">'+E(q.q)+'</h2><div role="group" aria-label="Answer options">'+opts+'</div>'+fb+
   '<div class="row mt"><button class="gbtn light" id="qprev"'+(pos===0?' disabled':'')+'>'+I("left",18)+' Previous</button><span class="spacer"></span>'+(rec?'':'<button class="gbtn" id="qsub"'+(sel==null?' disabled':'')+'>Submit answer</button>')+'<button class="gbtn '+(rec?'':'light')+'" id="qnext">'+(pos===list.length-1?'Finish':'Next')+' '+I("right",18)+'</button></div></div>'+
   scorePanel(t,list,pos)+'</div>';
  $$(".opt").forEach(function(b){b.onclick=function(){if(rec)return;PICK[t+qi]=+b.dataset.j;renderBank(t);};});
  var sb=$("#qsub");if(sb)sb.onclick=function(){var s=PICK[t+qi];if(s==null)return;S.bank[t][qi]={sel:s,ok:s===q.a};delete PICK[t+qi];PICK.hold=true;save();renderBank(t);};
  $("#qprev").onclick=function(){PICK.hold=false;QI[t]=Math.max(0,pos-1);renderBank(t);};
  $("#qnext").onclick=function(){PICK.hold=false;if(pos<list.length-1){QI[t]=pos+1;renderBank(t);}else{if(RETRY[t]){RETRY[t]=null;QI[t]=0;}PICK.review=false;renderBank(t);var s2=bankStats(t);if(s2.a<s2.n){var first=-1;for(var i=0;i<B.length;i++)if(!S.bank[t][i]){first=i;break;}if(first>=0){QI[t]=first;renderBank(t);toast((s2.n-s2.a)+" question(s) still unanswered");}}}};
  $$(".dots button").forEach(function(b){b.onclick=function(){PICK.hold=false;QI[t]=+b.dataset.p;renderBank(t);};});
  var rb=$("#qretry");if(rb)rb.onclick=function(){startRetry(t);};
}
function scorePanel(t,list,pos){
  var st=bankStats(t),B=bank(t);
  return '<aside class="glass score"><h3>Score</h3><div class="stat">Total score <span>'+st.c+' / '+st.n+'</span></div><div class="stat">Percentage <span>'+Math.round(st.c/st.n*100)+'%</span></div><div class="stat">Accuracy (answered) <span>'+(st.a?Math.round(st.c/st.a*100)+'%':'—')+'</span></div><div class="stat">Answered <span>'+st.a+'</span></div><div class="stat" style="border:0">Remaining <span>'+(st.n-st.a)+'</span></div>'+
  '<div class="dots" aria-label="Question navigator">'+list.map(function(qi,p){var r=S.bank[t][qi];return '<button data-p="'+p+'" class="'+(r?(r.ok?'r':'w'):'')+(p===pos?' cur':'')+'" aria-label="Question '+(qi+1)+'">'+(qi+1)+'</button>';}).join("")+'</div>'+
  '<button class="gbtn sm warn mt" id="qretry" style="width:100%"'+(st.a-st.c?'':' disabled')+'>'+I("refresh",16)+' Retry incorrect ('+(st.a-st.c)+')</button></aside>';
}
function startRetry(t){var w=[];for(var k in S.bank[t])if(!S.bank[t][k].ok)w.push(+k);if(!w.length)return;w.sort(function(a,b){return a-b;});w.forEach(function(k){delete S.bank[t][k];});RETRY[t]=w;QI[t]=0;save();renderBank(t);toast("Retrying "+w.length+" question(s)");}
function renderSummary(t){
  var st=bankStats(t),p=Math.round(st.c/st.n*100),B=bank(t);
  var msg=p>=90?"Excellent — exam ready.":p>=75?"Strong performance. Review the explanations for the missed items.":p>=50?"Fair. Retry the incorrect questions, then revisit the related modules.":"Needs work. Revisit Modules 4–7 and retry.";
  $("#qbody").innerHTML='<div class="glass summary"><div class="eyebrow">Final performance summary · '+(t==="mcq"?"Multiple choice":"True / False")+'</div><div class="bigscore mt">'+p+'%</div><p style="font-size:1.2rem;font-weight:800">'+st.c+' correct out of '+st.n+'</p><p class="muted">'+msg+'</p>'+
  '<div class="row" style="justify-content:center"><button class="gbtn warn" id="sretry"'+(st.n-st.c?'':' disabled')+'>'+I("refresh",18)+' Retry incorrect ('+(st.n-st.c)+')</button><button class="gbtn light" id="sreview">'+I("eye",18)+' Review answers</button><button class="gbtn bad" id="sreset">Reset this quiz</button></div>'+
  '<div class="tbl-wrap mt2" style="text-align:left"><table class="gt"><thead><tr><th>#</th><th>Question</th><th>Result</th></tr></thead><tbody>'+B.map(function(q,i){var r=S.bank[t][i];return '<tr><td>'+(i+1)+'</td><td>'+E(q.q)+'</td><td style="color:'+(r&&r.ok?'var(--ok)':'var(--bad)')+';font-weight:800">'+(r&&r.ok?'Correct':'Incorrect')+'</td></tr>';}).join("")+'</tbody></table></div></div>';
  $("#sretry").onclick=function(){startRetry(t);};
  $("#sreview").onclick=function(){PICK.review=true;QI[t]=0;renderBank(t);};
  $("#sreset").onclick=function(){S.bank[t]={};QI[t]=0;save();renderBank(t);};
}
function rateBtns(store,key){var v=store[key];return '<div class="row" role="group" aria-label="Self-assessment"><button class="gbtn sm '+(v==="know"?'ok':'light')+'" data-rate="know">I know this</button><button class="gbtn sm '+(v==="rev"?'warn':'light')+'" data-rate="rev">Needs revision</button><button class="gbtn sm '+(v==="no"?'bad':'light')+'" data-rate="no">I don\'t understand yet</button></div>';}

function bindRate(store,key,cb,root){$$("[data-rate]",root).forEach(function(b){b.onclick=function(){store[key]=b.dataset.rate;save();cb();toast(b.dataset.rate==="know"?"Great — marked as known":"Added to your revision list");};});}

var RV="must",RAPID=0,RAUTO=null;
R.rev=function(opt){
  if(opt&&opt.sub)RV=opt.sub;
  var tabs=[["must","What I must know"],["cheat","Cheat sheet"],["defs","Definitions & terms"],["cmp","Comparisons"],["resp","Responsibilities checklist"],["prof","Professor questions"],["facts","Case facts"],["mist","Mistakes to avoid"],["rapid","Last-minute mode"],["s2","2-minute script"],["s5","5-minute script"],["mylist","My revision list"]];
  $("#v-rev").innerHTML='<div class="secthead"><div><div class="eyebrow">Mode 6</div><h1 style="margin:0">Final revision</h1></div><button class="gbtn sm light no-print" onclick="window.print()">'+I("print",16)+' Print this section</button></div><div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="gbtn sm '+(t[0]===RV?'':'light')+'" role="tab" aria-selected="'+(t[0]===RV)+'" data-rv="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div><div id="rvbody"></div>';
  $$("[data-rv]").forEach(function(b){b.onclick=function(){RV=b.dataset.rv;stopRapid();R.rev();};});
  var r=ZT.revision,h="";
  if(RV==="must")h='<div class="glass pad must"><h2>WHAT I MUST KNOW BEFORE THE DISCUSSION</h2><p class="muted">Organised by academic importance.</p>'+r.must.map(function(t,i){return '<div class="glass clear tier underglow '+["glow-p","glow-a","glow-c"][i]+'"><span class="ug"></span><h3>'+(i+1)+'. '+E(t.tier)+'</h3><ul>'+t.items.map(function(x){return '<li>'+E(x)+'</li>';}).join("")+'</ul></div>';}).join("")+'</div>';
  if(RV==="cheat")h='<div class="glass cheat"><div class="row"><div class="eyebrow">One-page cheat sheet</div><span class="spacer"></span>'+ZT.logo(40)+'</div><h2>Engagement Letter — on one page</h2><dl>'+r.cheat.map(function(c){return '<dt>'+E(c[0])+'</dt><dd>'+E(c[1])+'</dd>';}).join("")+'</dl></div>';
  if(RV==="defs")h='<div class="grid g2"><div class="glass pad"><h2>Important definitions</h2>'+r.defs.map(function(d){return '<p><b>'+E(d[0])+':</b> '+E(d[1])+'</p>';}).join("")+'</div><div class="glass pad"><h2>Most important terms</h2><div class="tbl-wrap"><table class="gt" style="min-width:0"><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>'+ZT.glossary.map(function(g){return '<tr><td>'+E(g[0])+'</td><td>'+E(g[1])+'<div class="ar-only" dir="rtl" lang="ar" style="font-family:var(--arfont);color:var(--muted)">'+EA(g[2])+'</div></td></tr>';}).join("")+'</tbody></table></div></div></div>';
  if(RV==="cmp")h='<div class="grid">'+ZT.comparisons.map(function(c){return '<div class="glass pad"><h3>'+E(c.t)+'</h3>'+tableHTML(c)+'</div>';}).join("")+'</div>';
  if(RV==="resp"){var ck=r.checklist;h='<div class="respboard">'+[["mgmt","Management","glow-p"],["aud","Auditor","glow-c"]].map(function(x){return '<div class="glass respcol underglow '+x[2]+'"><span class="ug"></span><h3>'+x[1]+' responsibilities</h3>'+ck[x[0]].map(function(it,j){var id=x[0]+j;return '<label class="check"><input type="checkbox" data-ck="'+id+'"'+(S.check[id]?' checked':'')+'><span>'+E(it)+'</span></label>';}).join("")+'</div>';}).join("")+'</div><p class="muted mt">Tick each responsibility once you can explain it aloud without notes.</p>';}
  if(RV==="prof")h='<div class="glass pad"><h2>Common professor questions</h2>'+ZT.mock.map(function(m,i){return '<details class="acc"><summary><span class="chip">'+({D:"Direct",C:"Conceptual",S:"Scenario"})[m.ty]+'</span> '+E(m.q)+'</summary><div class="body"><div class="model">'+E(m.a)+'</div></div></details>';}).join("")+'</div>';
  if(RV==="facts")h='<div class="glass pad"><h2>Key case-study facts</h2><div class="facts">'+ZT.caseFacts.map(function(f){return '<div class="fact"><small>'+E(f[0])+'</small><b>'+E(f[1])+'</b></div>';}).join("")+'</div></div>';
  if(RV==="mist")h='<div class="glass pad"><h2>Mistakes to avoid</h2>'+r.mistakes.map(function(m,i){return '<div class="sec-blk"><span class="mistake">✗ '+E(m)+'</span></div>';}).join("")+'</div>';
  if(RV==="rapid")h='<div class="glass rapid underglow glow-v"><span class="ug"></span><div class="eyebrow">Last-minute revision · '+(RAPID+1)+' / '+r.rapid.length+'</div><div class="line" id="rline">'+E(r.rapid[RAPID])+'</div><div class="row mt2" style="justify-content:center"><button class="gbtn light" id="rprev">'+I("left",18)+'</button><button class="gbtn" id="rauto">'+(RAUTO?'Pause':'Auto-play')+'</button><button class="gbtn light" id="rnext">'+I("right",18)+'</button></div></div>';
  if(RV==="s2")h='<div class="glass pad script"><div class="eyebrow">≈ 2 minutes · about 270 words</div><h2>2-minute English explanation</h2>'+r.script2.split("\n\n").map(function(p){return '<p>'+E(p)+'</p>';}).join("")+'<div class="ar mt" dir="rtl" lang="ar">نصيحة: قسّم الكلام لتلات أجزاء — التعريف والتوقيت، المراجعة بتشتغل إزاي، وتقسيم المسؤوليات. اتكلم ببطء، وقف ثانية بعد كل جزء، واذكر الأرقام والأسماء من الكيس عشان تبين إنك قريت الخطاب الحقيقي.</div></div>';
  if(RV==="s5")h='<div class="glass pad script"><div class="eyebrow">≈ 5 minutes · nine sections</div><h2>5-minute presentation script</h2><p class="muted">Each section includes Egyptian Arabic guidance on what to understand before you say it.</p>'+r.script5.map(function(s){return '<div class="sec-blk"><h3>'+E(s.h)+'</h3><p>'+E(s.en)+'</p><div class="ar" dir="rtl" lang="ar">'+EA(s.ar)+'</div></div>';}).join("")+'</div>';
  if(RV==="mylist"){var o=ZT.oral.map(function(q,i){return [i,q.q,S.oral[i]];}).filter(function(x){return x[2]&&x[2]!=="know";}),m=ZT.mock.map(function(q,i){return [i,q.q,S.mock[i]];}).filter(function(x){return x[2]&&x[2]!=="know";}),tp=TOPICS.filter(function(x){return !S.done[x.t.id];});
    h='<div class="grid g2"><div class="glass pad"><h2>Needs revision</h2>'+(o.length+m.length?'':'<p class="muted">Nothing flagged yet. Use the Oral simulator and the Discussion quiz to rate yourself.</p>')+o.map(function(x){return '<div class="sec-blk"><span class="chip">Oral</span> '+(x[2]==="no"?'🔴':'🟠')+' '+E(x[1])+' <button class="gbtn sm light" data-goral="'+x[0]+'">Practise</button></div>';}).join("")+m.map(function(x){return '<div class="sec-blk"><span class="chip">Discussion</span> '+(x[2]==="no"?'🔴':'🟠')+' '+E(x[1])+' <button class="gbtn sm light" data-gmock="'+x[0]+'">Practise</button></div>';}).join("")+'</div>'+
    '<div class="glass pad"><h2>Topics not yet completed ('+tp.length+')</h2>'+tp.map(function(x){return '<div class="sec-blk">'+E(x.t.t)+' <button class="gbtn sm light" data-gtopic="'+x.m.id+'">Study</button></div>';}).join("")+'</div></div>';}
  $("#rvbody").innerHTML=h;
  $$("[data-ck]").forEach(function(c){c.onchange=function(){S.check[c.dataset.ck]=c.checked;save();};});
  $$("[data-goral]").forEach(function(b){b.onclick=function(){OF="all";OP=+b.dataset.goral;OREVEAL=false;go("oral");};});
  $$("[data-gmock]").forEach(function(b){b.onclick=function(){QI.mock=+b.dataset.gmock;go("quiz",{tab:"mock"});};});
  $$("[data-gtopic]").forEach(function(b){b.onclick=function(){go("learn",{mod:b.dataset.gtopic});};});
  if(RV==="rapid"){var n=r.rapid.length;$("#rprev").onclick=function(){RAPID=(RAPID-1+n)%n;R.rev();};$("#rnext").onclick=function(){RAPID=(RAPID+1)%n;R.rev();};
    $("#rauto").onclick=function(){if(RAUTO){stopRapid();R.rev();}else{RAUTO=setInterval(function(){if(RV!=="rapid"||!$("#rline")){stopRapid();return;}RAPID=(RAPID+1)%n;R.rev();},4000);R.rev();}};}
};
function stopRapid(){if(RAUTO){clearInterval(RAUTO);RAUTO=null;}}

/* ───────── global wiring ───────── */
document.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b){e.preventDefault();var o={};if(b.dataset.mod)o.mod=b.dataset.mod;if(b.dataset.sub)o.sub=b.dataset.sub;go(b.dataset.go,o);}});
document.addEventListener("keydown",function(e){
  if(e.target.matches("textarea,input"))return;
  if(S.view==="flash"){if(e.key==="ArrowRight"){$("#fnext").click();}else if(e.key==="ArrowLeft"){$("#fprev").click();}else if(e.key===" "&&document.activeElement&&!document.activeElement.matches("button:not(#fcard)")){e.preventDefault();$("#fcard").classList.toggle("flipped");}else if(e.key.toLowerCase()==="m"){$("#fmast").click();}}
});
window.addEventListener("beforeprint",function(){$$("details").forEach(function(d){d.setAttribute("data-wasopen",d.open);d.open=true;});});
window.addEventListener("afterprint",function(){$$("details").forEach(function(d){d.open=d.getAttribute("data-wasopen")==="true";});});
function init(){
  $("#brandlogo").innerHTML=ZT.logo(44);$("#footlogo").innerHTML=ZT.logo(36);
  $$(".nav button").forEach(function(b){b.onclick=function(){go(b.dataset.v);};});
  $$("#langseg button").forEach(function(b){b.onclick=function(){S.lang=b.dataset.l;save();applyPrefs();};});
  $("#themebtn").onclick=function(){var cur=document.documentElement.getAttribute("data-theme");S.theme=cur==="dark"?"light":"dark";save();applyPrefs();};
  $("#printbtn").onclick=function(){window.print();};
  $("#brand").onclick=function(){go("dash");};
  applyPrefs();
  var h=(location.hash||"").slice(1);go(VIEWS.indexOf(h)>=0?h:"dash");
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body>
</html>
